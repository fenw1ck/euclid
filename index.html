const parallel=(a,b,c,d,t=1.5)=>{const u=[b[0]-a[0],b[1]-a[1]],v=[d[0]-c[0],d[1]-c[1]];return Math.abs((u[0]*v[1]-u[1]*v[0])/(Math.hypot(...u)*Math.hypot(...v)))<Math.sin(t*Math.PI/180)};

else if(d.mode==="rot"){const c=W.pts[d.op.c],th=nrm(angOf(c,p)-d.a0);d.th=th;d.img=[rotP(W.pts[d.op.a],c,th),rotP(W.pts[d.op.b],c,th)]}
else{const o=W.pts[d.c],a=angOf(o,p);const dl=nrm(a-d.prev);const n=Math.ceil(Math.abs(dl)*180/Math.PI);for(let i=0;i<=n;i++){const t=d.prev+dl*(n?i/n:0);d.o.cov[Math.floor(((t*180/Math.PI)%360+360)%360)]=1}d.prev=a;d.cur=[o[0]+d.o.r*Math.cos(a),o[1]+d.o.r*Math.sin(a)];W.pts.cur=d.cur;resolve()}
draw()});
svg.addEventListener("pointerup",e=>{if(W.pan){W.pan=null;return}const d=W.drag;if(!d)return;if(d.mode==="slide"){if(!W.won)W.drag=null;return}W.drag=null;delete W.pts.cur;const p=xy(e),sc=W.vb[2]/640;

svg.addEventListener("wheel",e=>{if(P.kind==="read")return;e.preventDefault();const p=xy(e);zoom(e.deltaY>0?1.15:1/1.15,p[0],p[1])},{passive:false});
function check(){if(P.kind!=="play"||W.won||W.busy||!complete())return;W.won=true;win()}
async function win(){if(P.finalSeg)for(const k of P.finalSeg)W.segs.add(k);for(const k of P.bold||[])W.bold.add(k);const ph=P.phases(W);
for(const p of ph){if(W.stop)break;W.hl={c:p.c||[],s:p.s||[],r:p.r||[],hide:p.hide||[],ang:p.ang||[],cls:p.cls||"h1"};
if(p.swing){const[c,f,t]=p.swing,C=W.pts[c],a0=angOf(C,W.pts[f]),dl=nrm(angOf(C,W.pts[t])-a0),r=dist(C,W.pts[f]);for(let i=0;i<=24&&!W.stop;i++){W.pts.cur=[C[0]+r*Math.cos(a0+dl*i/24),C[1]+r*Math.sin(a0+dl*i/24)];W.extra=[[c,"cur"]];say(p.txt);draw();await sleep(40)}delete W.pts.cur;W.extra=null}
if(p.extra)W.extra=p.extra;say(p.txt);draw();await sleep(2400)}
W.hl=null;draw();markDone();fx(P.winTxt);say("");$("done").innerHTML=`<div class="card"><b>${P.winTxt}</b><div class="row"><button id="again">Watch the proof again</button></div></div>`;usesBar()}
/* ---- Solve it for me / One small step / Use ---- */
function setCursor(p){W.cursor=p?p.slice():null}
async function glide(to,steps=14){if(!W.cursor){setCursor(to);draw();return}const f=W.cursor.slice();for(let i=1;i<=steps&&!W.stop;i++){setCursor([f[0]+(to[0]-f[0])*i/steps,f[1]+(to[1]-f[1])*i/steps]);draw();await sleep(22)}}
function needAngles(op){const k=op.c+">"+op.p,deps=OPS.filter(x=>auto(x)&&(x.c1===k||x.c2===k||x.c===k)),out=[];const o=circ(k);for(const d of deps){const l=tgt(d);if(l)for(const[n,X]of l)if(!W.pts[n])out.push(angOf(W.pts[op.c],X))}return out}
async function act(op){const sc=W.vb[2]/640;
if(op.t==="place"){const q=placePos(op,null);await glide(q);W.pts[op.n]=q;finish(op);draw();await sleep(300)}
else if(op.t==="line"){if(op.pv){const c0=W.circs.find(x=>x.c===op.a)||W.circs.find(x=>x.c===op.b),ctr=c0.c,p0=W.pts[c0.p],a0=angOf(W.pts[ctr],p0),tg=op.a===ctr?op.b:op.a,dl=nrm(angOf(W.pts[ctr],W.pts[tg])-a0);await glide(p0,8);for(let i=0;i<=24&&!W.stop;i++){const t=a0+dl*i/24,q=[W.pts[ctr][0]+c0.r*Math.cos(t),W.pts[ctr][1]+c0.r*Math.sin(t)];W.pts.cur=q;W.anim={line:[ctr,"cur"],cls:"h1"};W.segs.add(sk(ctr,c0.p));setCursor(q);draw();await sleep(30)}delete W.pts.cur;W.anim=null}
else{await glide(W.pts[op.a]);W.pts.cur=W.pts[op.a].slice();W.anim={line:[op.a,"cur"],cls:"dot"};const f=W.pts[op.a],t=W.pts[op.b];for(let i=1;i<=16&&!W.stop;i++){W.pts.cur=[f[0]+(t[0]-f[0])*i/16,f[1]+(t[1]-f[1])*i/16];setCursor(W.pts.cur);draw();await sleep(24)}delete W.pts.cur;W.anim=null}finish(op);draw();await sleep(300)}
else if(op.t==="circ"){const c=W.pts[op.c],p0=W.pts[op.p],a0=angOf(c,p0);let o=circ(op.c+">"+op.p);if(!o){o={c:op.c,p:op.p,r:dist(c,p0),cov:new Uint8Array(360),done:false};W.circs.push(o)}await glide(p0);
const need=needAngles(op),dirs=[1,-1].map(s=>Math.max(0,...need.map(a=>{let d=(a-a0)*s;while(d<0)d+=2*Math.PI;return d}))),dir=need.length&&dirs[1]<dirs[0]?-1:1,span=need.length?Math.min(2*Math.PI,Math.min(...dirs)+.2):2*Math.PI,N=FAST?2:Math.max(8,Math.round(span/.09));
for(let i=0;i<=N&&!W.stop;i++){const t=a0+dir*span*i/N,q=[c[0]+o.r*Math.cos(t),c[1]+o.r*Math.sin(t)];const t0=a0+dir*span*Math.max(0,i-1)/N;for(let j=0;j<=4;j++){const tt=t0+(t-t0)*j/4;o.cov[Math.floor(((tt*180/Math.PI)%360+360)%360)]=1}W.pts.cur=q;W.anim={line:[op.c,"cur"],cls:"h1"};setCursor(q);resolve();draw();await sleep(22);if(W.done.has(op.i))break}
if(!W.done.has(op.i)){o.cov.fill(1);resolve()}delete W.pts.cur;W.anim=null;W.done.add(op.i);o.done=true;resolve();W.hl={c:[op.c+">"+op.p],cls:"h2"};draw();await sleep(350);W.hl=null;draw()}
else if(op.t==="ext"){const a=W.pts[op.o],b=W.pts[op.tt],L=dist(a,b),u=[(b[0]-a[0])/L,(b[1]-a[1])/L];await glide(b);W.drag={mode:"ext",op,cur:b};for(let i=1;i<=10&&!W.stop;i++){W.drag.cur=[b[0]+u[0]*9*i*sc,b[1]+u[1]*9*i*sc];setCursor(W.drag.cur);draw();await sleep(30)}W.drag=null;finish(op);draw();await sleep(300)}
else if(op.t==="rot"){const c=W.pts[op.c],th=nrm(angOf(c,W.pts[op.e])-angOf(c,W.pts[op.b])),pm=[(W.pts[op.a][0]+W.pts[op.b][0])/2,(W.pts[op.a][1]+W.pts[op.b][1])/2];await glide(pm);W.drag={mode:"rot",op,th:0,img:[W.pts[op.a],W.pts[op.b]]};for(let i=0;i<=24&&!W.stop;i++){const t=th*i/24;W.drag.img=[rotP(W.pts[op.a],c,t),rotP(W.pts[op.b],c,t)];setCursor(rotP(pm,c,t));draw();await sleep(36)}W.drag=null;finish(op);fx("Matched!");draw();await sleep(500)}
else if(op.t==="tri"){W.flashTri=[op.a,op.b,op.c];W.flash=op.c;draw();await sleep(700);W.flashTri=null;finish(op);fx("Prop 1");draw();await sleep(400)}
resolve();if(W.flash){draw();await sleep(300);W.flash=null}if(!FAST)fit();draw()}
async function runOps(tag,one){if(W.busy)return;W.busy=true;W.stop=false;$("stop").style.display="";say("Watch what the hand does, then try it yourself.");
for(const op of OPS){if(W.stop)break;if(W.done.has(op.i)||auto(op)||(tag!==undefined&&tag!==null&&op.u!==tag))continue;if(op.g&&W.chosen&&op.g!==W.chosen)continue;if(op.g&&op.g!=="C"&&!W.chosen)continue;if(!ready(op))continue;await act(op);if(one)break}
setCursor(null);W.busy=false;$("stop").style.display="none";resolve();draw();usesBar();if(!W.stop&&complete()&&!W.won){W.won=true;await win()}}
async function slideSolve(){if(W.busy)return;W.busy=true;fresh();draw();const pa={A:"D",B:"E",C:"F"},mv=["A","B","C"];await glide([(W.pts.A[0]+W.pts.B[0]+W.pts.C[0])/3,(W.pts.A[1]+W.pts.B[1]+W.pts.C[1])/3]);const dx=W.pts.D[0]-W.pts.A[0],dy=W.pts.D[1]-W.pts.A[1];for(let i=1;i<=20;i++){for(const k of mv){W.pts[k]=[W.orig[k][0]+dx*i/20,W.orig[k][1]+dy*i/20]}setCursor([W.cursor[0]+dx/20,W.cursor[1]+dy/20]);draw();await sleep(30)}W.sl.pivot="A";W.sl.mover="ABC";say("Clicked into place. Now swing round the glowing corner.");draw();await sleep(500);
const c=W.pts.D,th=nrm(angOf(c,W.pts.E)-angOf(c,W.pts.B)),base=["B","C"].map(k=>W.pts[k].slice());for(let i=1;i<=24;i++){["B","C"].forEach((k,j)=>W.pts[k]=rotP(base[j],c,th*i/24));draw();await sleep(36)}W.sl.matched=true;W.busy=false;await slideWin()}
async function solveAll(){if(W.busy)return;if(P.kind==="slide")return slideSolve();fresh();$("done").innerHTML="";draw();await runOps(null)}
document.addEventListener("click",e=>{const b=e.target.closest("button,[data-node]");if(!b)return;
if(b.dataset.r)return go(b.dataset.r);if(b.dataset.go)return go(+b.dataset.go);if(b.dataset.node)return renderMap(+b.dataset.node);

if(b.id==="zin")return zoom(1/1.25);if(b.id==="zout")return zoom(1.25);if(b.id==="zfit")return fit();
if(b.id==="rn"){W.k++;return renderRead()}if(b.id==="ra"){W.k=P.proof.length;return renderRead()}
if(b.id==="prev"&&cur>0)return go(ALL[cur-1].id);if(b.id==="next"&&cur<ALL.length-1)return go(ALL[cur+1].id);
