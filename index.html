const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]),sleep=ms=>FAST?Promise.resolve():new Promise(r=>setTimeout(r,ms));
const equalLen=(p,q,r,s,t=2)=>Math.abs(dist(p,q)-dist(r,s))<t;
const angleAt=(a,b,c)=>{const u=[a[0]-b[0],a[1]-b[1]],v=[c[0]-b[0],c[1]-b[1]];return Math.acos((u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)))*180/Math.PI};
const parallel=(a,b,c,d,t=1.5)=>{const u=[b[0]-a[0],b[1]-a[1]],v=[d[0]-c[0],d[1]-c[1]];return Math.abs((u[0]*v[1]-u[1]*v[0])/(Math.hypot(...u)*Math.hypot(...v)))<Math.sin(t*Math.PI/180)};
function icc(p,r1,q,r2){const d=dist(p,q),a=(r1*r1-r2*r2+d*d)/(2*d),h=Math.sqrt(Math.max(r1*r1-a*a,0)),mx=p[0]+a*(q[0]-p[0])/d,my=p[1]+a*(q[1]-p[1])/d,ox=-h*(q[1]-p[1])/d,oy=h*(q[0]-p[0])/d;return[[mx+ox,my+oy],[mx-ox,my-oy]]}
function icr(c,r,o,t){const L=dist(o,t),u=[(t[0]-o[0])/L,(t[1]-o[1])/L],w=[o[0]-c[0],o[1]-c[1]],b=u[0]*w[0]+u[1]*w[1],k=w[0]*w[0]+w[1]*w[1]-r*r,disc=b*b-k;if(disc<0)return null;const ts=[-b-Math.sqrt(disc),-b+Math.sqrt(disc)].filter(x=>x>=0);if(!ts.length)return null;const tt=Math.max(...ts);return[o[0]+u[0]*tt,o[1]+u[1]*tt]}
function icl(c,r,a,b){const L=dist(a,b),u=[(b[0]-a[0])/L,(b[1]-a[1])/L],w=[a[0]-c[0],a[1]-c[1]],bb=u[0]*w[0]+u[1]*w[1],k=w[0]*w[0]+w[1]*w[1]-r*r,disc=bb*bb-k;if(disc<0)return null;return[-bb-Math.sqrt(disc),-bb+Math.sqrt(disc)].map(t=>[a[0]+u[0]*t,a[1]+u[1]*t])}
function irs(o,t,a,b){const d=[t[0]-o[0],t[1]-o[1]],e=[b[0]-a[0],b[1]-a[1]],den=d[0]*e[1]-d[1]*e[0];if(Math.abs(den)<1e-9)return null;const w=[a[0]-o[0],a[1]-o[1]],s=(w[0]*e[1]-w[1]*e[0])/den,u=(w[0]*d[1]-w[1]*d[0])/den;if(s<0||u<-.001||u>1.001)return null;return[o[0]+s*d[0],o[1]+s*d[1]]}
const ALL=[
{id:1,t:"Construct an equilateral triangle",stmt:"On a given finite straight line to construct an equilateral triangle.",uses:[],kind:"play",gives:"We can build an equilateral triangle on any line, and we can use circles to compare the lengths of lines.",
 pts:{A:[230,230],B:[410,230]},segs0:[],alts:["C","D"],
 ops:[["line","A","B"],["circ","A","B"],["circ","B","A"],["pt","C",["A>B","B>A"],"up",{g:"C"}],["pt","D",["A>B","B>A"],"down",{g:"D"}],["line","A","C",{pv:1,g:"C"}],["line","B","C",{pv:1,g:"C"}],["line","A","D",{pv:1,g:"D"}],["line","B","D",{pv:1,g:"D"}]],
 core:[["line","A","B"],["circ","A","B"],["circ","B","A"],["pt","C",["A>B","B>A"],"up"],["tri","A","B","C"]],
 phases:W=>{const T=W.chosen||"C";return[{c:["A>B"],s:["AB","A"+T],cls:"h1",txt:"Circle A (solid blue): AB and A"+T+" are both radii, so they are equal."},{c:["B>A"],s:["AB","B"+T],cls:"h2",txt:"Circle B (dashed orange): BA and B"+T+" are both radii, so they are equal."},{s:["AB","A"+T,"B"+T],cls:"g",txt:"All three sides equal AB, so they equal each other."}]},
 proof:["AB is the given line. Draw the circle with centre A and radius AB, and the circle with centre B and radius BA (Postulate 3).","The circles meet at C. Join CA and CB (Postulate 1).","A is the centre of the first circle, so AC = AB. B is the centre of the second, so BC = BA.","Things equal to the same thing are equal to each other (Common Notion 1), so AC = BC.","So AB = BC = CA, and triangle ABC is equilateral."],
 winTxt:"Equilateral triangle! Now we can change a line’s position without changing its length, make an equilateral triangle and use circles to compare lengths of lines."},
{id:2,t:"Place a line equal to a given line at a point",stmt:"To place at a given point (as an extremity) a straight line equal to a given straight line.",uses:[1],kind:"play",gives:"We can put a line of a specific length anywhere we want it.",

 phases:W=>[{c:["B>C"],s:["BC"],cls:"h1",txt:"Circle B (solid blue): BF and BC are radii, so BF = BC."},{c:["D>F"],hide:["AD","BD","AB"],cls:"h2",txt:"The triangle fades. Circle D (dashed orange): DE and DF are radii, so DE = DF. DA = DB, so AE = BF."},{s:["AE","BC"],cls:"g",txt:"AE, BF and CB are all the same length."}],

{id:4,t:"Two sides and the angle between them",stmt:"If two triangles have the two sides equal to two sides respectively, and have the angles contained by the equal straight lines equal, they will also have the base equal to the base, the triangle will be equal to the triangle, and the remaining angles will be equal to the remaining angles respectively, namely those which the equal sides subtend.",uses:[],kind:"read",gives:"We can prove two triangles are exactly the same by matching two sides and the angle between them.",
 proof:["Triangles ABC and DEF have AB = DE, AC = DF, and angle BAC = angle EDF.","Lay triangle ABC onto DEF so that A sits on D and AB lies along DE.","Because AB = DE, point B lands on E. Because the angles are equal, AC lies along DF, and because AC = DF, point C lands on F.","So BC fits exactly on EF: BC = EF.","Therefore the triangles are equal, and the remaining angles are equal: ABC = DEF and ACB = DFE."]},
{id:5,t:"Base angles of an isosceles triangle",stmt:"The base angles of an isosceles triangle are equal: in isosceles triangles the angles at the base are equal to one another, and, if the equal straight lines be produced further, the angles under the base will be equal to one another.",uses:[3,4],kind:"read",gives:"We can compare angles inside a single triangle just by knowing two sides are equal.",
 proof:["Triangle ABC has AB = AC. Extend AB to D and AC to E.","Pick F on BD. Cut off AG = AF on CE (Proposition 3). Join FC and GB.","AF = AG, AC = AB and the angle at A is shared, so triangles AFC and AGB are equal (Proposition 4): FC = GB, angle AFC = angle AGB, angle ACF = angle ABG.","Since AF = AG and AB = AC, we get BF = CG.","Triangles BFC and CGB have BF = CG, FC = GB and angle BFC = angle CGB, so they are equal (Proposition 4): angle FBC = angle GCB.","Taking away equal parts, angle ABC = angle ACB."]},
{id:6,t:"Equal angles mean equal sides",stmt:"If in a triangle two angles be equal to one another, the sides which subtend the equal angles will also be equal to one another.",uses:[3,4],kind:"read",gives:"We can go from equal angles to equal sides. This is the reverse of Proposition 5.",link:["Proof by contradiction (overview)","https://en.wikipedia.org/wiki/Proof_by_contradiction"],note:"A proof by contradiction assumes the opposite of what you want to show, follows the logic, and reaches something impossible. That means the assumption must be false.",
 proof:["Triangle ABC has angle ABC = angle ACB. We want AB = AC.","Suppose, to test it, that AB is longer than AC.","Cut off DB = AC from the longer line (Proposition 3). Join DC.","DB = AC, BC is shared, and angle DBC = angle ACB. So DC = AB and triangle DBC = triangle ACB (Proposition 4).","But triangle DBC is only part of triangle ACB. The less would equal the greater, which is absurd.","So AB is not unequal to AC. Therefore AB = AC."]},
{id:7,t:"Two triangles cannot share a base and sides",stmt:"Given two straight lines constructed on a straight line (from its extremities) and meeting in a point, there cannot be constructed on the same straight line, on the same side of it, two other straight lines meeting in another point and equal to the former two respectively, each to the one with the same extremity.",uses:[5],kind:"read",gives:"A triangle is fixed by its three side lengths. There is no second apex for the same two sides.",
 proof:["Take AC and CB on base AB meeting at C. Suppose AD = AC and DB = CB meet at another point D on the same side.","Join CD. Since AC = AD, angle ACD = angle ADC (Proposition 5). So angle ADC is greater than angle DCB.","So angle CDB is much greater than angle DCB.","Since CB = DB, angle CDB = angle DCB (Proposition 5).","But we showed CDB is much greater than DCB. That is impossible, so no such D exists."]},
{id:8,t:"Three equal sides make equal triangles",stmt:"If two triangles have the two sides equal to two sides respectively, and have also the base equal to the base, they will also have the angles equal which are contained by the equal straight lines.",uses:[7],kind:"read",gives:"We can prove triangles are the same just from their three side lengths.",
 proof:["Triangles ABC and DEF have AB = DE, AC = DF and BC = EF.","Move ABC onto DEF with B on E and BC along EF. Since BC = EF, C lands on F.","If A did not land on D, there would be two triangles on the same base with equal sides. Proposition 7 forbids that.","So A lands on D, and angle BAC = angle EDF."]},
{id:9,t:"Bisect an angle",stmt:"To bisect a given rectilineal angle.",uses:[1,3,8],kind:"play",pts:{A:[200,320],B:[520,320],C:[380,100]},segs0:["AB","AC"],
 ops:[["place","D",{on:"AB",t:.45}],["circ","A","D",{vanish:1}],["ptr","E","A>D","A>C"],["line","D","E"],["use",1,{A:"D",B:"E"},{C:"F"},"away:A"],["line","A","F"]],

{id:10,t:"Bisect a line",stmt:"To bisect a given finite straight line.",uses:[1,4,9],kind:"play",pts:{A:[150,300],B:[500,300]},segs0:["AB"],bold:["AM","BM"],

{id:11,t:"Draw a perpendicular at a point on a line",stmt:"To draw a straight line at right angles to a given straight line from a given point on it.",uses:[1,3,8],kind:"play",pts:{A:[120,300],B:[540,300],C:[330,300]},segs0:["AB"],
 ops:[["place","D",{on:"CA",t:.5}],["circ","C","D"],["ptr","E","C>D","C>B"],["use",1,{A:"D",B:"E"},{C:"F"},"up"],["line","C","F"]],

{id:12,t:"Draw a perpendicular from a point off a line",stmt:"To a given infinite straight line, from a given point which is not on it, to draw a perpendicular straight line.",uses:[8,10],kind:"play",pts:{A:[100,320],B:[540,320],C:[330,200]},segs0:["AB"],
 ops:[["place","D",{free:1,away:"C",line:"AB",rec:[330,395]}],["line","C","D"],["circ","C","D"],["pt2","F","G","C>D","A","B"],["use",10,{A:"F",B:"G"},{M:"H"}],["line","C","H"]],

{id:13,t:"Angles on a straight line",stmt:"If a straight line set up on a straight line make angles, it will make either two right angles or angles equal to two right angles.",uses:[11],kind:"read",gives:"We know angles that sit along a straight line always add up to two right angles.",
 proof:["Line CD stands on AB at C, making angles ACD and DCB.","If CD is perpendicular, both angles are right angles and the claim is true (Definition 10).","If not, draw CE perpendicular to AB (Proposition 11).","Angle ACD + angle DCB = angle ACE + angle ECD + angle DCB. And ECD + DCB = ECB.","So ACD + DCB = ACE + ECB, which is two right angles."]},
{id:14,t:"Two angles that make a straight line",stmt:"If with any straight line, and at a point on it, two straight lines not lying on the same side make the adjacent angles equal to two right angles, the two straight lines will be in a straight line with one another.",uses:[13],kind:"read",gives:"We can tell when two lines form one straight line, just from their angles.",
 proof:["At B on AB, lines BC and BD lie on opposite sides, and angle CBA + angle ABD = two right angles.","Suppose BD is not the continuation of CB, and let BE be the line that is.","Then angle CBA + angle ABE = two right angles (Proposition 13).","So angle ABE = angle ABD, which is impossible unless BE and BD are the same line.","Therefore CB and BD form one straight line."]},

function near(p,skip){let b=null,bd=26*W.vb[2]/640;const gp=greyPts();for(const id in W.pts){if(id===skip||gp.has(id))continue;const d=dist(W.pts[id],p);if(d<bd){bd=d;b=id}}return b}
function placePos(op,tap){if(op.on){const A=W.pts[op.on[0]],B=W.pts[op.on[1]];if(!A||!B)return null;let s=op.pt===undefined?.5:op.pt;if(tap){const d=[B[0]-A[0],B[1]-A[1]];s=((tap[0]-A[0])*d[0]+(tap[1]-A[1])*d[1])/(d[0]*d[0]+d[1]*d[1]);s=Math.max(.12,Math.min(.88,s))}return[A[0]+s*(B[0]-A[0]),A[1]+s*(B[1]-A[1])]}return tap?tap.slice():op.rec}
function placeOK(op,q){if(!op.free||!op.away)return true;const a=W.pts[op.line[0]],b=W.pts[op.line[1]],s=p=>(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);return s(q)*s(W.pts[op.away])<0}
function pending(f){return OPS.filter(o=>!W.done.has(o.i)&&!auto(o)&&ready(o)&&f(o))}
svg.addEventListener("pointerdown",e=>{if(P.kind!=="play"||W.won||W.busy||W.hl)return;const p=xy(e),id=near(p);
if(!id){const pl=pending(o=>o.t==="place")[0];if(pl){const q=placePos(pl,p);if(!placeOK(pl,q))return say("Tap on the other side of the line.");W.pts[pl.n]=q;finish(pl);say("");update();check();return}
const tr=pending(o=>o.t==="tri")[0];if(tr){const s=(p1,p2,p3)=>(p1[0]-p3[0])*(p2[1]-p3[1])-(p2[0]-p3[0])*(p1[1]-p3[1]),A=W.pts[tr.a],B=W.pts[tr.b],C=W.pts[tr.c],d1=s(p,A,B),d2=s(p,B,C),d3=s(p,C,A);if(!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0))){finish(tr);fx("Prop 1");say("");update();check();return}}
W.pan={x:e.clientX,y:e.clientY,vb:W.vb.slice()};svg.setPointerCapture(e.pointerId);return}
svg.setPointerCapture(e.pointerId);
let c=pending(o=>o.t==="circ"&&o.p===id)[0];if(c){const a=Math.atan2(W.pts[id][1]-W.pts[c.c][1],W.pts[id][0]-W.pts[c.c][0]);let o=circ(c.c+">"+c.p);if(!o){o={c:c.c,p:c.p,r:dist(W.pts[c.c],W.pts[c.p]),cov:new Uint8Array(360),done:false};W.circs.push(o)}W.drag={mode:"comp",p:id,c:c.c,prev:a,cur:W.pts[id],o,op:c,line:[c.c,"cur"],cls:"h1"};say("");draw();return}
const pv=pending(o=>o.t==="line"&&o.pv).find(o=>{const cc=o.a;return W.circs.some(x=>x.c===cc&&x.p===id&&x.done)||W.circs.some(x=>x.c===o.b&&x.p===id&&x.done)});if(pv){const ctr=W.circs.some(x=>x.c===pv.a&&x.p===id&&x.done)?pv.a:pv.b,a=Math.atan2(W.pts[id][1]-W.pts[ctr][1],W.pts[id][0]-W.pts[ctr][0]),o=circ(ctr+">"+id);W.drag={mode:"comp",p:id,c:ctr,prev:a,cur:W.pts[id],o,line:[ctr,"cur"],cls:"h1"};say("");draw();return}
const ex=pending(o=>o.t==="ext"&&o.tt===id)[0];if(ex){W.drag={mode:"ext",p:id,op:ex,cur:p};draw();return}
const ln=pending(o=>o.t==="line"&&!o.pv&&(o.a===id||o.b===id))[0];if(ln){W.drag={mode:"line",p:id,cur:p,line:[id,"cur"],cls:"dot",op:ln};draw();return}
say("That isn’t needed right now. Look for the pulsing dot.");draw()});
svg.addEventListener("pointermove",e=>{if(W.pan){const r=svg.getBoundingClientRect(),v=W.pan.vb;setVB([v[0]-(e.clientX-W.pan.x)*v[2]/r.width,v[1]-(e.clientY-W.pan.y)*v[3]/r.height,v[2],v[3]]);return}
const d=W.drag;if(!d)return;const p=xy(e);if(d.mode==="line"||d.mode==="ext"){d.cur=p;if(d.line)W.pts.cur=p}
else{const o=W.pts[d.c],a=Math.atan2(p[1]-o[1],p[0]-o[0]);let dl=a-d.prev;while(dl>Math.PI)dl-=2*Math.PI;while(dl<-Math.PI)dl+=2*Math.PI;const n=Math.ceil(Math.abs(dl)*180/Math.PI);for(let i=0;i<=n;i++){const t=d.prev+dl*(n?i/n:0);d.o.cov[Math.floor(((t*180/Math.PI)%360+360)%360)]=1}d.prev=a;d.cur=[o[0]+d.o.r*Math.cos(a),o[1]+d.o.r*Math.sin(a)];W.pts.cur=d.cur}
draw()});
svg.addEventListener("pointerup",e=>{if(W.pan){W.pan=null;return}const d=W.drag;if(!d)return;W.drag=null;delete W.pts.cur;const p=xy(e);
if(d.mode==="comp"){const o=d.o,n=o.cov.reduce((a,b)=>a+b,0);if(d.op&&n>=340&&!o.done){o.cov.fill(1);o.done=true;finish(d.op);say("Circle done.")}
else if(!d.op){const q=near(p,d.p),pv=q&&pending(x=>x.t==="line"&&x.pv&&sk(x.a,x.b)===sk(d.c,q))[0];if(pv&&Math.abs(dist(W.pts[d.c],W.pts[q])-o.r)<10*W.vb[2]/640){finish(pv);say("Good: the line slid along the circle and stayed.")}else say("Slide the line until it lands on one of the two crossing points.")}else say("Keep going all the way round.")}
else if(d.mode==="line"){const q=near(p,d.p);if(q&&sk(q,d.p)===sk(d.op.a,d.op.b)){finish(d.op);say("")}else say("Drag all the way to the other dot.")}
else{const op=d.op,a=W.pts[op.o],b=W.pts[op.tt],u=[b[0]-a[0],b[1]-a[1]],v=[p[0]-b[0],p[1]-b[1]],dot=(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)||1);if(Math.hypot(...v)>40*W.vb[2]/640&&dot>.9){finish(op);say("")}else say("Pull straight away along the line.")}
update();check()});
svg.addEventListener("wheel",e=>{if(P.kind!=="play")return;e.preventDefault();const p=xy(e);zoom(e.deltaY>0?1.15:1/1.15,p[0],p[1])},{passive:false});
function check(){if(W.won||W.busy||!complete())return;W.won=true;win()}
/* ---- win replay ---- */
async function win(){if(P.finalSeg)for(const k of P.finalSeg)W.segs.add(k);for(const k of P.bold||[])W.bold.add(k);const ph=P.phases(W);
for(const p of ph){if(W.stop)break;W.hl={c:p.c||[],s:p.s||[],r:p.r||[],hide:p.hide||[],ang:p.ang||[],cls:p.cls};say(p.txt);draw();await sleep(2600)}W.hl=null;draw();markDone();fx("Proved!");say("");$("done").innerHTML=`<div class="card"><b>${P.winTxt}</b><div class="row"><button id="again">Watch the proof again</button></div></div>`;usesBar()}
/* ---- Solve it for me / Use buttons: animated by the same recipe ---- */
function setCursor(p){W.cursor=p?p.slice():null}
async function glide(to,steps=14){if(!W.cursor){setCursor(to);draw();return}const f=W.cursor.slice();for(let i=1;i<=steps&&!W.stop;i++){setCursor([f[0]+(to[0]-f[0])*i/steps,f[1]+(to[1]-f[1])*i/steps]);draw();await sleep(22)}}
async function act(op){const sc=W.vb[2]/640;
if(op.t==="place"){const q=placePos(op,null);await glide(q);W.pts[op.n]=q;finish(op);draw();await sleep(300)}
else if(op.t==="line"){if(op.pv){const ctr=op.a,c0=W.circs.find(x=>x.c===ctr&&x.done)||W.circs.find(x=>x.c===op.b&&x.done),ctr2=c0.c,p0=W.pts[c0.p],a0=Math.atan2(p0[1]-W.pts[ctr2][1],p0[0]-W.pts[ctr2][0]),tgt=sk(op.a,op.b).replace(ctr2,""),tg=op.a===ctr2?op.b:op.a,a1=Math.atan2(W.pts[tg][1]-W.pts[ctr2][1],W.pts[tg][0]-W.pts[ctr2][0]);let dl=a1-a0;while(dl>Math.PI)dl-=2*Math.PI;while(dl<-Math.PI)dl+=2*Math.PI;await glide(p0,8);for(let i=0;i<=24&&!W.stop;i++){const t=a0+dl*i/24,q=[W.pts[ctr2][0]+c0.r*Math.cos(t),W.pts[ctr2][1]+c0.r*Math.sin(t)];W.pts.cur=q;W.anim={line:[ctr2,"cur"],cls:"h1"};setCursor(q);draw();await sleep(30)}delete W.pts.cur;W.anim=null}
else{await glide(W.pts[op.a]);W.pts.cur=W.pts[op.a].slice();W.anim={line:[op.a,"cur"],cls:"dot"};const f=W.pts[op.a],t=W.pts[op.b];for(let i=1;i<=16&&!W.stop;i++){W.pts.cur=[f[0]+(t[0]-f[0])*i/16,f[1]+(t[1]-f[1])*i/16];setCursor(W.pts.cur);draw();await sleep(24)}delete W.pts.cur;W.anim=null}finish(op);draw();await sleep(300)}
else if(op.t==="circ"){const c=W.pts[op.c],p0=W.pts[op.p],a0=Math.atan2(p0[1]-c[1],p0[0]-c[0]);let o=circ(op.c+">"+op.p);if(!o){o={c:op.c,p:op.p,r:dist(c,p0),cov:new Uint8Array(360),done:false};W.circs.push(o)}await glide(p0);const N=FAST?1:60;for(let i=0;i<=N&&!W.stop;i++){const t=a0+2*Math.PI*i/N,q=[c[0]+o.r*Math.cos(t),c[1]+o.r*Math.sin(t)];for(let d=0;d<=6;d++)o.cov[Math.floor((((t*180/Math.PI)-(FAST?0:6)+(FAST?0:d))%360+360)%360)]=1;W.pts.cur=q;W.anim={line:[op.c,"cur"],cls:"h1"};setCursor(q);draw();await sleep(22)}o.cov.fill(1);o.done=true;delete W.pts.cur;W.anim=null;finish(op);W.hl={c:[op.c+">"+op.p],cls:"h2"};draw();await sleep(450);W.hl=null;draw()}
else if(op.t==="ext"){const a=W.pts[op.o],b=W.pts[op.tt],L=dist(a,b),u=[(b[0]-a[0])/L,(b[1]-a[1])/L];await glide(b);await glide([b[0]+u[0]*90*sc,b[1]+u[1]*90*sc]);finish(op);draw();await sleep(300)}
else if(op.t==="tri"){W.flashTri=[op.a,op.b,op.c];W.flash=op.c;draw();await sleep(700);W.flashTri=null;finish(op);fx("Prop 1");draw();await sleep(400)}
resolve();if(W.flash){draw();await sleep(350);W.flash=null}if(!FAST)fit();draw()}
async function runOps(tag){if(W.busy)return;W.busy=true;W.stop=false;$("stop").style.display="";say("Watch what the hand does, then try it yourself.");
for(const op of OPS){if(W.stop)break;if(W.done.has(op.i)||auto(op)||(tag!==undefined&&tag!==null&&op.u!==tag))continue;if(op.g&&op.g!=="C"&&!W.chosen)continue;if(op.g&&W.chosen&&op.g!==W.chosen)continue;await act(op)}
setCursor(null);W.busy=false;$("stop").style.display="none";resolve();draw();usesBar();if(!W.stop&&complete()&&!W.won){W.won=true;await win()}}
async function solveAll(){if(W.busy)return;const vb=[0,0,640,420];fresh();$("done").innerHTML="";draw();await runOps(null)}
/* ---- UI ---- */
document.addEventListener("click",e=>{const b=e.target.closest("button,[data-node]");if(!b)return;
if(b.dataset.r)return go(b.dataset.r);if(b.dataset.go)return go(+b.dataset.go);if(b.dataset.node)return renderMap(+b.dataset.node);
if(b.dataset.use!==undefined)return runOps(+b.dataset.use);
if(b.id==="solve")return solveAll();if(b.id==="stop"){W.stop=true;return}if(b.id==="again"){W.won=false;return check()}
if(b.id==="zin")return zoom(1/1.25);if(b.id==="zout")return zoom(1.25);if(b.id==="zfit")return fit();
if(b.id==="rn"){W.k++;return renderRead()}if(b.id==="ra"){W.k=P.proof.length;return renderRead()}
if(b.id==="prev"&&cur>0)return go(ALL[cur-1].id);if(b.id==="next"&&cur<ALL.length-1)return go(ALL[cur+1].id);
if(b.id==="reset"){W.stop=true;return load(P.id)}});
if(typeof NOBOOT==="undefined")go("home");
