{id:39,t:"Equal triangles on one base lie between parallels",stmt:"Equal triangles on the same base and on the same side lie between the same parallels.",uses:[31, 37],kind:"read",gives:"The converse of Proposition 37.",proof:["Equal triangles ABC and DBC stand on base BC, same side. Join AD. We want AD parallel to BC.", "Suppose not: draw AE parallel to BC and join EC (Proposition 31).", "Triangle ABC equals triangle EBC (Proposition 37).", "But ABC equals DBC, so DBC equals EBC: the whole equals a part, which is impossible.", "So AD is parallel to BC."]},
{id:40,t:"Equal triangles on equal bases lie between parallels",stmt:"Equal triangles on equal bases and on the same side lie between the same parallels.",uses:[31, 38],kind:"read",gives:"The converse of Proposition 38.",proof:["Equal triangles ABC and CDE stand on equal bases BC and CE, same side. Join AD. We want AD parallel to BE.", "Suppose not: draw AF parallel to BE and join FE (Proposition 31).", "Triangle ABC equals triangle FCE (Proposition 38).", "But ABC equals DCE, so DCE equals FCE: the whole equals a part, which is impossible.", "So AD is parallel to BE."]},
{id:41,t:"A parallelogram is double a triangle",stmt:"If a parallelogram and a triangle have the same base and lie between the same parallels, the parallelogram is double the triangle.",uses:[34, 37],kind:"read",gives:"A triangle is half of the parallelogram on the same base.",proof:["Parallelogram ABCD and triangle EBC stand on base BC between the same parallels. Join AC.", "Triangles ABC and EBC share base BC between the same parallels, so they are equal (Proposition 37).", "The diagonal AC cuts the parallelogram into two equal triangles (Proposition 34), so the parallelogram is double ABC.", "So the parallelogram is double EBC."]},
{id:42,t:"Make a parallelogram equal to a triangle",stmt:"To construct a parallelogram equal to a given triangle, with a given angle.",uses:[10, 23, 31, 38, 41],kind:"read",gives:"We can reshape a triangle into a parallelogram with any angle we choose.",proof:["Triangle ABC and angle D. Cut BC in half at E (Proposition 10) and join AE.", "At E on EC, make angle CEF equal to angle D (Proposition 23).", "Through A draw AG parallel to EC, and through C draw CG parallel to EF (Proposition 31). FECG is a parallelogram.", "Triangles ABE and AEC have equal bases BE and EC between the same parallels, so they are equal (Proposition 38). So ABC is double AEC.", "The parallelogram FECG is also double AEC (Proposition 41), so FECG equals triangle ABC, and it has the angle D."]},
{id:43,t:"Complements of a parallelogram",stmt:"In any parallelogram, the two complements of the parallelograms about a diagonal are equal.",uses:[34],kind:"read",gives:"A way to reshape one parallelogram into another of the same area.",proof:["Parallelogram ABCD with diagonal AC and a point K on AC. Lines through K parallel to the sides make parallelograms EH and FG about the diagonal, and the complements BK and KD.", "The diagonal cuts ABCD into equal triangles ABC and ACD (Proposition 34).", "The same for EH: triangle AEK = AHK. And for FG: KFC = KGC.", "Adding: AEK + KGC = AHK + KFC.", "Take these from the equal triangles ABC and ADC: the complement BK equals the complement KD."]},
{id:44,t:"Apply a parallelogram to a line",stmt:"To a given line, apply a parallelogram equal to a given triangle, in a given angle.",uses:[15, 29, 31, 42, 43],kind:"read",gives:"We can put an area onto a line of any length.",proof:["Line AB, triangle C, angle D. Build parallelogram BEFG equal to triangle C in angle D, with BE along AB (Proposition 42).", "Extend FG to H. Draw AH parallel to BG. Join HB.", "Lines HB and FE meet at K (the parallel postulate). Draw KL parallel to EA and extend HA and GB.", "LB and BF are the complements about diagonal HK, so they are equal (Proposition 43).", "BF equals triangle C, so LB equals triangle C. Angle ABM equals angle GBE (vertical angles, Proposition 15), which equals D."]},
{id:45,t:"A parallelogram equal to any straight-sided figure",stmt:"To construct a parallelogram equal to a given straight-sided figure, in a given angle.",uses:[14, 29, 30, 33, 34, 42, 44],kind:"read",gives:"Any straight-sided area can become a parallelogram.",proof:["Figure ABCD and angle E. Join DB to cut the figure into triangles ABD and DBC.", "Build parallelogram FH equal to triangle ABD in angle E (Proposition 42).", "Apply parallelogram GM equal to triangle DBC to line GH in angle E (Proposition 44).", "The angle sums show that KH is in line with HM, and FG is in line with GL (Propositions 29 and 14).", "KFLM is then a parallelogram (Propositions 30, 33 and 34), and it equals the whole figure."]},
{id:46,t:"A square on a line",stmt:"To describe a square on a given line.",uses:[3, 11, 29, 31, 34],kind:"read",gives:"The square, our unit of area.",proof:["Line AB. Draw AC at right angles to AB at A (Proposition 11).", "Make AD = AB (Proposition 3).", "Draw DE parallel to AB and BE parallel to AD (Proposition 31). ADEB is a parallelogram.", "Opposite sides are equal (Proposition 34) and AB = AD, so all four sides are equal.", "Angle BAD is right, and the two inside angles on one side add to two right angles (Proposition 29), so ADE is right. Opposite angles are equal, so all four angles are right.", "A four-sided figure with equal sides and right angles is a square."]},
{id:47,t:"The Pythagorean theorem",stmt:"In a right triangle, the square on the side opposite the right angle equals the two squares on the other sides added together.",uses:[4, 14, 31, 41, 46],kind:"read",gives:"The most famous theorem in geometry.",proof:["Right triangle ABC with the right angle at A. Draw squares on BC, BA and AC (Proposition 46).", "Draw AL through A parallel to BD. Join AD and FC. CA is in line with AG, and BA with AH (Proposition 14).", "Angle DBA = angle FBC (each is a right angle plus ABC). DB = BC and FB = BA, so triangles ABD and FBC match (Proposition 4).", "Rectangle BL is double triangle ABD, and square GB is double triangle FBC (Proposition 41). So BL = GB.", "In the same way, rectangle CL equals square HC.", "So the whole square on BC equals the two other squares added together."]},
{id:48,t:"Converse of the Pythagorean theorem",stmt:"If the square on one side of a triangle equals the squares on the other two sides, the angle between those two sides is a right angle.",uses:[3, 8, 11, 47],kind:"read",gives:"We can test for a right angle just by measuring sides.",proof:["Triangle ABC with the square on BC equal to the squares on BA and AC.", "At A draw AD at right angles to AC (Proposition 11), make AD = BA (Proposition 3), and join DC.", "The square on DC equals the squares on DA and AC (Proposition 47). That equals the squares on BA and AC, which equals the square on BC. So DC = BC.", "Triangles DAC and BAC have equal sides all round, so they match (Proposition 8).", "So angle BAC = angle DAC, which is a right angle."]}];

else if(op.t==="rot"){const c=W.pts[op.c],th=nrm(angOf(c,W.pts[op.e])-angOf(c,W.pts[op.b])),pm=[(W.pts[op.a][0]+W.pts[op.b][0])/2,(W.pts[op.a][1]+W.pts[op.b][1])/2];await glide(pm);W.drag={mode:"rot",op,th:0,img:[W.pts[op.a],W.pts[op.b]]};for(let i=0;i<=24&&!W.stop;i++){const t=th*i/24;W.drag.img=[rotP(W.pts[op.a],c,t),rotP(W.pts[op.b],c,t)];setCursor(rotP(pm,c,t));draw();await sleep(36)}W.drag=null;finish(op);fx("Matched!");draw();await sleep(500)}
else if(op.t==="lay"){const q=op.tri.map(k=>W.pts[k]);await glide([(q[0][0]+q[1][0]+q[2][0])/3,(q[0][1]+q[1][1]+q[2][1])/3]);await layAnim(op,[0,0]);W.flash=null;draw();await sleep(300)}
else if(op.t==="wrong"){wrongInit(op);const a=op.path(W,0),to=Math.min(1,op.need+.25);await glide(a);for(let i=1;i<=20&&!W.stop;i++){wrongAt(op,to*i/20);setCursor(W.pts[op.n]);draw();await sleep(30)}finish(op);draw();await sleep(300)}
else if(op.t==="tri"){W.flashTri=[op.a,op.b,op.c];W.flash=op.c;draw();await sleep(700);W.flashTri=null;finish(op);fx("Prop 1");draw();await sleep(400)}
resolve();if(W.flash){draw();await sleep(300);W.flash=null}if(!FAST)fit();draw()}
async function runOps(tag,one){if(W.busy)return;W.busy=true;W.stop=false;$("stop").style.display="";say("Watch what the hand does, then try it yourself.");
for(const op of OPS){if(W.stop)break;if(W.done.has(op.i)||auto(op)||(tag!==undefined&&tag!==null&&op.u!==tag))continue;if(op.g&&W.chosen&&op.g!==W.chosen)continue;if(op.g&&!W.chosen&&op.g!==(OPS.find(x=>x.g)||{}).g)continue;if(!ready(op))continue;await act(op);if(one)break}
setCursor(null);W.busy=false;$("stop").style.display="none";resolve();draw();usesBar();if(!W.stop&&complete()&&!W.won){W.won=true;await win()}}
async function slideSolve(){if(W.busy)return;W.busy=true;fresh();draw();const pa={A:"D",B:"E",C:"F"},mv=["A","B","C"];await glide([(W.pts.A[0]+W.pts.B[0]+W.pts.C[0])/3,(W.pts.A[1]+W.pts.B[1]+W.pts.C[1])/3]);const dx=W.pts.D[0]-W.pts.A[0],dy=W.pts.D[1]-W.pts.A[1];for(let i=1;i<=20;i++){for(const k of mv){W.pts[k]=[W.orig[k][0]+dx*i/20,W.orig[k][1]+dy*i/20]}setCursor([W.cursor[0]+dx/20,W.cursor[1]+dy/20]);draw();await sleep(30)}W.sl.pivot="A";W.sl.mover="ABC";say("Clicked into place. Now swing round the glowing corner.");draw();await sleep(500);
const c=W.pts.D,th=nrm(angOf(c,W.pts.E)-angOf(c,W.pts.B)),base=["B","C"].map(k=>W.pts[k].slice());for(let i=1;i<=24;i++){["B","C"].forEach((k,j)=>W.pts[k]=rotP(base[j],c,th*i/24));draw();await sleep(36)}W.sl.matched=true;W.sl.aligned=true;W.busy=false;await slideWin()}
async function solveAll(){if(W.busy)return;if(P.kind==="slide")return slideSolve();fresh();$("done").innerHTML="";draw();await runOps(null)}
document.addEventListener("click",e=>{const b=e.target.closest("button,[data-node]");if(!b)return;
if(b.dataset.r)return go(b.dataset.r);if(b.dataset.go)return go(+b.dataset.go);if(b.dataset.node)return renderMap(+b.dataset.node);
if(b.dataset.use!==undefined)return runOps(+b.dataset.use);
if(b.id==="solve")return solveAll();if(b.id==="step"&&P.kind==="play")return runOps(null,true);if(b.id==="stop"){W.stop=true;return}if(b.id==="again"){W.won=false;return P.kind==="play"?check():null}
if(b.id==="zin")return zoom(1/1.25);if(b.id==="zout")return zoom(1.25);if(b.id==="zfit")return fit();
if(b.id==="hs"){showSteps=!showSteps;return P.kind==="read"?renderRead():renderSteps()}if(b.id==="rn"){W.k++;return renderRead()}if(b.id==="ra"){W.k=P.proof.length;return renderRead()}
if(b.id==="prev"&&cur>0)return go(ALL[cur-1].id);if(b.id==="next"&&cur<ALL.length-1)return go(ALL[cur+1].id);
if(b.id==="reset"){W.stop=true;return load(P.id)}});
if(typeof NOBOOT==="undefined")go("home");
