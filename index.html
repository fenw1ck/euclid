<script>
const $=id=>document.getElementById(id),svg=$("s"),FAST=typeof FASTMODE!=="undefined";
const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]),sleep=ms=>FAST?Promise.resolve():new Promise(r=>setTimeout(r,ms));
const equalLen=(p,q,r,s,t=2)=>Math.abs(dist(p,q)-dist(r,s))<t;
const angleAt=(a,b,c)=>{const u=[a[0]-b[0],a[1]-b[1]],v=[c[0]-b[0],c[1]-b[1]];return Math.acos((u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)))*180/Math.PI};
const parallel=(a,b,c,d,t=1.5)=>{const u=[b[0]-a[0],b[1]-a[1]],v=[d[0]-c[0],d[1]-c[1]];return Math.abs((u[0]*v[1]-u[1]*v[0])/(Math.hypot(...u)*Math.hypot(...v)))<Math.sin(t*Math.PI/180)};
function icc(p,r1,q,r2){const d=dist(p,q),a=(r1*r1-r2*r2+d*d)/(2*d),h=Math.sqrt(Math.max(r1*r1-a*a,0)),mx=p[0]+a*(q[0]-p[0])/d,my=p[1]+a*(q[1]-p[1])/d,ox=-h*(q[1]-p[1])/d,oy=h*(q[0]-p[0])/d;return[[mx+ox,my+oy],[mx-ox,my-oy]]}
function icr(c,r,o,t){const L=dist(o,t),u=[(t[0]-o[0])/L,(t[1]-o[1])/L],w=[o[0]-c[0],o[1]-c[1]],b=u[0]*w[0]+u[1]*w[1],k=w[0]*w[0]+w[1]*w[1]-r*r,disc=b*b-k;if(disc<0)return null;const ts=[-b-Math.sqrt(disc),-b+Math.sqrt(disc)].filter(x=>x>=0);if(!ts.length)return null;const tt=Math.max(...ts);return[o[0]+u[0]*tt,o[1]+u[1]*tt]}
const has=(W,k)=>W.segs.has(k),done=(W,k)=>W.circs.some(c=>c.c+">"+c.p===k&&c.done);
/* ---- proposition data ---- */
const ALL=[
{id:1,t:"Construct an equilateral triangle",stmt:"On a given finite straight line to construct an equilateral triangle.",uses:[],kind:"play",auto:true,tools:[],
 gives:"We can build an equilateral triangle on any line, and we can use circles to compare the lengths of lines.",
 pts:{A:[230,230],B:[410,230]},segs0:[],lineOK:["AB"],allowSeg:["AB","AC","BC","AD","BD"],circ:[["A","B"],["B","A"]],rays:[],
 reveal:[{n:"C",of:["A>B","B>A"],pick:"up"},{n:"D",of:["A>B","B>A"],pick:"down"}],excl:[["C","D"]],
 goal:W=>["C","D"].some(n=>has(W,"AB")&&has(W,"A"+n)&&has(W,"B"+n)),
 steps:[["Draw the line AB: drag from A to B (dotted while you drag, solid when it lands).",W=>has(W,"AB"),"Drag from A to B."],["Draw the circle with centre A through B: grab B and sweep it all the way round A.",W=>done(W,"A>B"),"Grab B and drag it round A."],["Draw the circle with centre B through A: grab A and sweep it round B.",W=>done(W,"B>A"),"Grab A and drag it round B."],["The circles meet at C and D. Grab A or B and slide the line along its circle to C or D.",W=>!!W.pts.C,"Finish both circles."],["Make AC and BC (or AD and BD). The other point goes grey.",W=>W.won,"Slide AB along circle A to the meeting point, then along circle B to the same point."]],
 play:W=>{const T=has(W,"AC")?"C":"D";return[{c:["A>B"],s:["AB","A"+T],cls:"h1",txt:"Circle A (solid blue): AB and A"+T+" are both radii, so they are equal."},{c:["B>A"],s:["AB","B"+T],cls:"h2",txt:"Circle B (dashed orange): BA and B"+T+" are both radii, so they are equal."},{s:["AB","A"+T,"B"+T],cls:"g",txt:"All three sides equal AB, so they equal each other (Common Notion 1)."}]},
 prove:W=>{const T=has(W,"AC")?"C":"D",P=W.pts;return`Equilateral triangle: angles ${angleAt(P.B,P.A,P[T]).toFixed(0)}°, ${angleAt(P.A,P.B,P[T]).toFixed(0)}°, ${angleAt(P.A,P[T],P.B).toFixed(0)}°.`},
 winTxt:"Equilateral triangle! Now we can change a line’s position without changing its length, make an equilateral triangle and use circles to compare lengths of lines."},
{id:2,t:"Place a line equal to a given line at a point",stmt:"To place at a given point (as an extremity) a straight line equal to a given straight line.",uses:[1],kind:"play",tools:["line","compass","extend"],
 gives:"We can put a line of a specific length anywhere we want it.",
 pts:{A:[210,300],B:[310,300],C:[362,330]},segs0:["BC"],lineOK:["AB","AE"],allowSeg:["AB","BC","AD","BD","AE"],circ:[["A","B"],["B","A"],["B","C"],["D","F"]],rays:[["D","A"],["D","B"]],
 reveal:[{n:"D",of:["A>B","B>A"],pick:"up"},{n:"F",of:["B>C","ray:D>B"],pick:"far"},{n:"E",of:["D>F","ray:D>A"],pick:"far"}],excl:[],tri:true,
 macro:{label:"Use Proposition 1 for me",id:1},
 goal:W=>!!W.pts.E&&has(W,"AE")&&equalLen(W.pts.A,W.pts.E,W.pts.B,W.pts.C),
 steps:[["Start with line CB and point A. Draw a line from A to B (dotted, then solid).",W=>has(W,"AB"),"Line tool: drag from A to B."],["Use A or B to draw two circles (Compass tool). They meet at D.",W=>!!W.pts.D,"Compass tool: sweep B round A, then A round B."],["Tap the dotted triangle to remove the circles and make the triangle solid. That is Proposition 1.",W=>W.triSolid,"Tap inside the dotted triangle."],["Extend DB beyond B and DA beyond A (Extend tool).",W=>W.rays.length>=2,"Extend tool: pull B and A outward."],["Circle with centre B through C (Compass). It cuts DB’s extension at F, so BF = CB.",W=>done(W,"B>C"),"Compass tool: sweep C round B."],["Circle with centre D through F (Compass). It cuts DA’s extension at E.",W=>done(W,"D>F"),"Compass tool: sweep F round D."],["Join A to E. Then AE = BF = CB.",W=>W.won,"Line tool: drag from A to E."]],
 play:W=>[{c:["B>C"],s:["BC"],r:["D>B"],cls:"h1",txt:"Circle B (solid blue): BF and BC are radii, so BF = BC."},{c:["D>F"],r:["D>A","D>B"],hide:["AD","BD","AB"],cls:"h2",txt:"The triangle disappears. Circle D (dashed orange): DE and DF are radii, so DE = DF. DA = DB, so AE = BF."},{s:["AE","BC"],cls:"g",txt:"AE, BF and CB are all the same length."}],
 prove:W=>`AE = ${dist(W.pts.A,W.pts.E).toFixed(0)}, CB = ${dist(W.pts.B,W.pts.C).toFixed(0)}.`,
 winTxt:"We learned how to put a line of specific length anywhere we want it."},
{id:3,t:"Cut off a line equal to a shorter one",stmt:"Construct equal segments by section: given two unequal straight lines, to cut off from the greater a straight line equal to the less.",uses:[2],kind:"play",tools:["compass"],
 gives:"We can shorten a long line so it matches the length of any shorter line.",
 pts:{A:[150,250],B:[590,250],P:[300,100],Q:[420,100]},noLab:["P","Q"],segs0:["AB","PQ"],segLabel:{PQ:"C"},lineOK:[],allowSeg:["AB","PQ","AD","AE"],circ:[["A","D"]],rays:[],hiddenRays:[["A","B"]],
 reveal:[{n:"E",of:["A>D","ray:A>B"],pick:"far"}],excl:[],macro:{label:"Use Proposition 2 on C",id:2},
 goal:W=>!!W.pts.E&&done(W,"A>D"),
 steps:[["Use Proposition 2 to move line C so it starts at A. Call its end D.",W=>!!W.pts.D,"Tap “Use Proposition 2 on C”."],["Hold D and sweep it round A to draw a circle (Compass tool).",W=>done(W,"A>D"),"Compass tool: drag D round A."],["The circle meets AB at E. AE = AD = C.",W=>W.won,"Finish the circle."]],
 play:W=>[{c:["A>D"],s:["AD","AE"],cls:"h1",txt:"AE and AD are radii of the same circle, so AE = AD. AD = C, so AE = C."},{s:["AE"],cls:"g",txt:"AE is the part of AB that equals C."}],
 prove:W=>`AE = ${dist(W.pts.A,W.pts.E).toFixed(0)}, C = ${dist(W.pts.P,W.pts.Q).toFixed(0)}.`,
 winTxt:"We learned how to shorten a line to equal an existing line."},
{id:4,t:"Two sides and the angle between them",stmt:"If two triangles have the two sides equal to two sides respectively, and have the angles contained by the equal straight lines equal, they will also have the base equal to the base, the triangle will be equal to the triangle, and the remaining angles will be equal to the remaining angles respectively, namely those which the equal sides subtend.",uses:[],kind:"read",gives:"We can prove two triangles are exactly the same by matching two sides and the angle between them.",
 proof:["Triangles ABC and DEF have AB = DE, AC = DF, and angle BAC = angle EDF.","Lay triangle ABC onto DEF so that A sits on D and AB lies along DE.","Because AB = DE, point B lands on E. Because the angles are equal, AC lies along DF, and because AC = DF, point C lands on F.","So BC fits exactly on EF: BC = EF.","Therefore the triangles are equal, and the remaining angles are equal: ABC = DEF and ACB = DFE."]},
{id:5,t:"Base angles of an isosceles triangle",stmt:"The base angles of an isosceles triangle are equal: in isosceles triangles the angles at the base are equal to one another, and, if the equal straight lines be produced further, the angles under the base will be equal to one another.",uses:[3,4],kind:"read",gives:"We can compare angles inside a single triangle just by knowing two sides are equal.",
 proof:["Triangle ABC has AB = AC. Extend AB to D and AC to E.","Pick F on BD. Cut off AG = AF on CE (Proposition 3). Join FC and GB.","AF = AG, AC = AB and the angle at A is shared, so triangles AFC and AGB are equal (Proposition 4): FC = GB, angle AFC = angle AGB, angle ACF = angle ABG.","Since AF = AG and AB = AC, we get BF = CG.","Triangles BFC and CGB have BF = CG, FC = GB and angle BFC = angle CGB, so they are equal (Proposition 4): angle FBC = angle GCB.","Taking away equal parts, angle ABC = angle ACB."]},
{id:6,t:"Equal angles mean equal sides",stmt:"If in a triangle two angles be equal to one another, the sides which subtend the equal angles will also be equal to one another.",uses:[3,4],kind:"read",gives:"We can go from equal angles to equal sides. This is the reverse of Proposition 5.",link:["Proof by contradiction (overview)","https://en.wikipedia.org/wiki/Proof_by_contradiction"],note:"A proof by contradiction assumes the opposite of what you want to show, follows the logic, and reaches something impossible. That means the assumption must be false.",
 proof:["Triangle ABC has angle ABC = angle ACB. We want AB = AC.","Suppose, to test it, that AB is longer than AC.","Cut off DB = AC from the longer line (Proposition 3). Join DC.","DB = AC, BC is shared, and angle DBC = angle ACB. So DC = AB and triangle DBC = triangle ACB (Proposition 4).","But triangle DBC is only part of triangle ACB. The less would equal the greater, which is absurd.","So AB is not unequal to AC. Therefore AB = AC."]},
{id:7,t:"Two triangles cannot share a base and sides",stmt:"Given two straight lines constructed on a straight line (from its extremities) and meeting in a point, there cannot be constructed on the same straight line, on the same side of it, two other straight lines meeting in another point and equal to the former two respectively, each to the one with the same extremity.",uses:[5],kind:"read",gives:"A triangle is fixed by its three side lengths. There is no second apex for the same two sides.",
 proof:["Take AC and CB on base AB meeting at C. Suppose AD = AC and DB = CB meet at another point D on the same side.","Join CD. Since AC = AD, angle ACD = angle ADC (Proposition 5). So angle ADC is greater than angle DCB.","So angle CDB is much greater than angle DCB.","Since CB = DB, angle CDB = angle DCB (Proposition 5).","But we showed CDB is much greater than DCB. That is impossible, so no such D exists."]},
{id:8,t:"Three equal sides make equal triangles",stmt:"If two triangles have the two sides equal to two sides respectively, and have also the base equal to the base, they will also have the angles equal which are contained by the equal straight lines.",uses:[7],kind:"read",gives:"We can prove triangles are the same just from their three side lengths.",
 proof:["Triangles ABC and DEF have AB = DE, AC = DF and BC = EF.","Move ABC onto DEF with B on E and BC along EF. Since BC = EF, C lands on F.","If A did not land on D, there would be two triangles on the same base with equal sides. Proposition 7 forbids that.","So A lands on D, and angle BAC = angle EDF."]},
{id:9,t:"Bisect an angle",stmt:"To bisect a given rectilineal angle.",uses:[1,3,8],kind:"read",gives:"We can cut any angle exactly in half.",
 proof:["Angle BAC is given. Choose any point D on AB.","Cut off AE = AD on AC (Proposition 3). Join DE.","Build an equilateral triangle DEF on DE (Proposition 1). Join AF.","AD = AE, AF is shared, and DF = EF. So angle DAF = angle EAF (Proposition 8).","The angle BAC is bisected by AF."]},
{id:10,t:"Bisect a line",stmt:"To bisect a given finite straight line.",uses:[1,4,9],kind:"read",gives:"We can find the exact middle of any line.",
 proof:["Line AB is given. Build an equilateral triangle ABC on it (Proposition 1).","Bisect angle ACB with a line meeting AB at D (Proposition 9).","AC = CB, CD is shared, and angle ACD = angle BCD. So AD = DB (Proposition 4).","AB is bisected at D."]},
{id:11,t:"Draw a perpendicular at a point on a line",stmt:"To draw a straight line at right angles to a given straight line from a given point on it.",uses:[1,3,8],kind:"read",gives:"We can draw a right angle on a line at any point we choose.",
 proof:["Line AB and point C on it are given. Choose any point D on AC.","Cut off CE = CD on CB (Proposition 3).","Build an equilateral triangle DFE on DE (Proposition 1). Join FC.","DC = CE, CF is shared, and DF = EF. So angle DCF = angle ECF (Proposition 8).","Equal adjacent angles on a straight line are right angles (Definition 10), so FC is perpendicular to AB."]},
{id:12,t:"Draw a perpendicular from a point off a line",stmt:"To a given infinite straight line, from a given point which is not on it, to draw a perpendicular straight line.",uses:[8,10],kind:"read",gives:"We can drop a perpendicular from any point to any line.",
 proof:["Line AB and point C off it are given. Choose a point D on the far side of AB.","With centre C and radius CD, draw a circle meeting AB at F and G.","Bisect FG at H (Proposition 10). Join CF, CH and CG.","FH = HG, HC is shared, and CF = CG (radii). So angle CHF = angle CHG (Proposition 8).","They are equal and adjacent on a straight line, so CH is perpendicular to AB."]},
{id:13,t:"Angles on a straight line",stmt:"If a straight line set up on a straight line make angles, it will make either two right angles or angles equal to two right angles.",uses:[11],kind:"read",gives:"We know angles that sit along a straight line always add up to two right angles.",
 proof:["Line CD stands on AB at C, making angles ACD and DCB.","If CD is perpendicular, both angles are right angles and the claim is true (Definition 10).","If not, draw CE perpendicular to AB (Proposition 11).","Angle ACD + angle DCB = angle ACE + angle ECD + angle DCB. And ECD + DCB = ECB.","So ACD + DCB = ACE + ECB, which is two right angles."]},
{id:14,t:"Two angles that make a straight line",stmt:"If with any straight line, and at a point on it, two straight lines not lying on the same side make the adjacent angles equal to two right angles, the two straight lines will be in a straight line with one another.",uses:[13],kind:"read",gives:"We can tell when two lines form one straight line, just from their angles.",
 proof:["At B on AB, lines BC and BD lie on opposite sides, and angle CBA + angle ABD = two right angles.","Suppose BD is not the continuation of CB, and let BE be the line that is.","Then angle CBA + angle ABE = two right angles (Proposition 13).","So angle ABE = angle ABD, which is impossible unless BE and BD are the same line.","Therefore CB and BD form one straight line."]},
{id:15,t:"Vertical angles are equal",stmt:"If two straight lines cut one another, they make the vertical angles equal to one another.",uses:[13],kind:"read",gives:"When two lines cross, opposite angles match.",
 proof:["Lines AB and CD cut at E. We want angle AEC = angle DEB and angle CEB = angle AED.","Angle AEC + angle CEB = two right angles (Proposition 13).","Angle CEB + angle BED = two right angles (Proposition 13).","So AEC + CEB = CEB + BED. Taking away CEB, angle AEC = angle BED.","In the same way angle CEB = angle AED.","Porism: when two lines cut, the four angles at the point add up to four right angles."]},
{id:16,t:"The outside angle is bigger",stmt:"In any triangle, if one of the sides be produced, the exterior angle is greater than either of the interior and opposite angles.",uses:[3,4,10,15],kind:"read",gives:"We can compare an outside angle of a triangle with the inside angles opposite to it.",
 proof:["Triangle ABC has BC extended to D. We want angle ACD greater than angle BAC.","Bisect AC at E (Proposition 10). Extend BE to F with EF = BE (Proposition 3). Join FC and extend AC to G.","AE = EC, BE = EF, and angle AEB = angle FEC (vertical angles, Proposition 15).","So triangles ABE and CFE are equal (Proposition 4): angle BAE = angle ECF.","But angle ECD is greater than angle ECF. So angle ACD is greater than angle BAE.","In the same way, bisecting BC shows angle BCG, which equals ACD, is greater than angle ABC."]}];
const BYID={};ALL.forEach(p=>BYID[p.id]=p);

let P,W,prog=[],cur=0,route="home";try{prog=JSON.parse(localStorage.getItem("euclid3")||"[]")}catch(e){}
const chip=id=>`<button class="chip" data-go="${id}">I.${id} ${BYID[id].t}</button>`;
function go(r){route=r;$("home").style.display=r==="home"?"":"none";$("map").style.display=r==="map"?"":"none";$("prop").style.display=typeof r==="number"?"":"none";if(r==="home")renderHome();else if(r==="map")renderMap(null);else load(r)}
function renderHome(){$("home").innerHTML=`<h1>Euclid’s Elements, Book I</h1><p class="sub">Build each proof yourself. ✔ means you have finished it.</p><div class="card warn"><b>Before you jump ahead:</b> later propositions rely on earlier ones. You can open any proposition, and each page lists what it relies on so you can go back to the earlier proofs.</div>`+ALL.map(p=>`<div class="card"><div class="item"><b>I.${p.id} ${p.t} ${prog.includes(p.id)?"✔":""}</b><button class="p" data-go="${p.id}">Open</button></div><div class="sub">${p.kind==="play"?"Interactive construction":"Proof steps (interactive figure coming)"}</div>${p.uses.length?`<div class="hl">Relies on: ${p.uses.map(chip).join("")}</div>`:`<div class="sub">Relies on nothing earlier.</div>`}</div>`).join("")+`<p class="sub">Propositions 17 to 48 are not built yet.</p>`}
const memo={};const depth=id=>memo[id]||(memo[id]=1+Math.max(0,...BYID[id].uses.map(depth)));
function renderMap(sel){const cols={};ALL.forEach(p=>(cols[depth(p.id)]=cols[depth(p.id)]||[]).push(p.id));const mx=Math.max(...Object.keys(cols).map(Number)),pos={};
for(const d in cols)cols[d].forEach((id,i)=>pos[id]=[40+(d-1)*(560/(mx-1)),50+(i+1)*(320/(cols[d].length+1))]);
const par=sel?BYID[sel].uses:[],chd=sel?ALL.filter(p=>p.uses.includes(sel)).map(p=>p.id):[];let e="",n="";
for(const p of ALL)for(const u of p.uses){const a=pos[u],b=pos[p.id],on=sel&&((p.id===sel)||(u===sel));e+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${on?(p.id===sel?"var(--c1)":"var(--c2)"):"var(--line)"}" stroke-width="${on?3:1.5}" ${on&&u===sel?'stroke-dasharray="7 5"':""} marker-end="url(#ar)"/>`}
for(const p of ALL){const q=pos[p.id],on=p.id===sel;n+=`<g data-node="${p.id}" style="cursor:pointer"><circle cx="${q[0]}" cy="${q[1]}" r="17" fill="${on?"var(--ok)":par.includes(p.id)?"var(--c1)":chd.includes(p.id)?"var(--c2)":"var(--card)"}" stroke="var(--ink)" stroke-width="2"/><text x="${q[0]}" y="${q[1]+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${on||par.includes(p.id)||chd.includes(p.id)?"#fff":"var(--ink)"}">${p.id}</text></g>`}
$("map").innerHTML=`<h1>Relationship map</h1><p class="sub">Each arrow points from a proposition to one that relies on it. Tap a number to see its parents (what it relies on) and children (what relies on it).</p><svg viewBox="0 0 640 420"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="22" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--mute)"/></marker></defs>${e}${n}</svg>`+
(sel?`<div class="card"><b>I.${sel} ${BYID[sel].t}</b><p><b>Parents (relies on, solid blue arrows in):</b> ${par.length?par.map(chip).join(" "):"none"}</p><p><b>Children (used by, dashed orange arrows out):</b> ${chd.length?chd.map(chip).join(" "):"none yet"}</p><button class="p" data-go="${sel}">Open I.${sel}</button></div>`:`<p class="sub">Tap a number to begin.</p>`)}
/* ---- fireworks ---- */
function fx(text){const d=document.createElement("div");d.className="fx";d.innerHTML=`<div class="fxt">${text}</div>`+Array.from({length:30},(_,i)=>{const a=i/30*6.283,r=90+Math.random()*110;return`<i style="--dx:${(Math.cos(a)*r).toFixed(0)}px;--dy:${(Math.sin(a)*r).toFixed(0)}px;--h:${i*12}"></i>`}).join("");$("fxbox").appendChild(d);setTimeout(()=>d.remove(),2300)}
/* ---- engine ---- */
const sk=(a,b)=>[a,b].sort().join("");
function load(id){cur=ALL.findIndex(p=>p.id===id);P=ALL[cur];W={pts:P.pts?JSON.parse(JSON.stringify(P.pts)):{},segs:new Set(P.segs0||[]),rays:(P.hiddenRays||[]).map(r=>r.slice()),circs:[],drag:null,hl:null,won:false,busy:false,tool:"line",triSolid:false,bold:new Set(),cap:""};
$("ttl").textContent=`Book I, Proposition ${P.id}: ${P.t}`;$("stmt").textContent=P.stmt;$("gives").textContent=P.gives;
const by=ALL.filter(p=>p.uses.includes(P.id));$("usedby").innerHTML=by.length?`Used later by: ${by.map(p=>"I."+p.id).join(", ")}.`:"Nothing later uses this yet.";
$("relies").innerHTML=P.uses.length?`<b>This proof relies on:</b> <div class="hl">${P.uses.map(chip).join("")}</div><div class="sub">Tap one to go back and see it.</div>`:`<b>This proof relies on nothing earlier.</b>`;
$("prev").disabled=cur===0;$("next").disabled=cur>=ALL.length-1;$("after").innerHTML="";
const play=P.kind==="play";$("stage").style.display=play?"":"none";$("tools").style.display=play?"":"none";$("hint").style.display=play?"":"none";
if(play){toolbar();say(P.steps[0][2]);draw()}else readInit()}
function readInit(){W.k=0;say("");renderRead()}
function renderRead(){const n=W.k;$("steps").innerHTML=P.proof.map((s,i)=>`<li class="st ${i<n?"on":""}" style="${i<n?"":"display:none"}">${s}</li>`).join("");
let a=P.link?`<p class="sub">${P.note}<br><a href="${P.link[1]}" target="_blank" rel="noopener">${P.link[0]}</a></p>`:"";
$("after").innerHTML=a+(n<P.proof.length?`<div class="row"><button class="p" id="rn">Show next step</button><button id="ra">Show all</button></div>`:`<p><b>Proved.</b></p>`);$("msg").textContent="Interactive figure for this proposition is coming. For now, read the proof one step at a time.";
if(n>=P.proof.length&&!prog.includes(P.id))markDone()}
function markDone(){prog.push(P.id);try{localStorage.setItem("euclid3",JSON.stringify(prog))}catch(e){}}
function toolbar(){const names={line:"Line",compass:"Compass",extend:"Extend"};$("tools").innerHTML=P.tools.map(t=>`<button data-t="${t}" class="${W.tool===t?"on":""}">${names[t]}</button>`).join("")+(P.macro?`<button class="p" id="use">${P.macro.label}</button>`:"")}
function say(t){$("msg").textContent=t}
const grey=n=>(P.excl||[]).some(g=>g.includes(n)&&g.filter(m=>m!==n).some(m=>[...W.segs].some(k=>k.includes(m))));
const names=()=>Object.keys(W.pts);
function circObj(c,p){let o=W.circs.find(x=>x.c===c&&x.p===p);if(!o){o={c,p,r:dist(W.pts[c],W.pts[p]),cov:new Uint8Array(360),done:false};W.circs.push(o)}return o}
function resolve(){for(const r of P.reveal||[]){if(W.pts[r.n])continue;const[o1,o2]=r.of;let pt=null;
if(o2.startsWith("ray:")){const[c,p]=o1.split(">"),cc=W.circs.find(x=>x.c===c&&x.p===p&&x.done),[ro,rt]=o2.slice(4).split(">");if(cc&&W.rays.some(x=>x[0]===ro&&x[1]===rt))pt=icr(W.pts[c],cc.r,W.pts[ro],W.pts[rt])}
else{const cs=r.of.map(k=>{const[c,p]=k.split(">");return W.circs.find(x=>x.c===c&&x.p===p&&x.done)});if(cs[0]&&cs[1]){const q=icc(W.pts[cs[0].c],cs[0].r,W.pts[cs[1].c],cs[1].r).sort((a,b)=>a[1]-b[1]);pt=r.pick==="up"?q[0]:q[1]}}
if(pt)W.pts[r.n]=pt}}
function arcD(c){const o=W.pts[c.c];let d="",pr=false;for(let k=0;k<360;k++){if(c.cov[k]){const a=k*Math.PI/180;d+=(pr?"L":"M")+(o[0]+c.r*Math.cos(a)).toFixed(1)+" "+(o[1]+c.r*Math.sin(a)).toFixed(1);pr=true}else pr=false}return d}
const pos=id=>W.drag&&W.drag.mode==="comp"&&W.drag.p===id?W.drag.cur:W.pts[id];
const hc=(t,k)=>W.hl&&W.hl[t]&&W.hl[t].includes(k)?W.hl.cls:"";
function draw(){let h="";const hide=(W.hl&&W.hl.hide)||[];
for(const c of W.circs)h+=`<path class="arc ${hc("c",c.c+">"+c.p)}" d="${arcD(c)}"/>`;
for(const[o,t]of W.rays){if((P.hiddenRays||[]).some(r=>r[0]===o&&r[1]===t))continue;const a=W.pts[o],b=W.pts[t],L=dist(a,b),u=[(b[0]-a[0])/L,(b[1]-a[1])/L];h+=`<line class="seg ray ${hc("r",o+">"+t)}" x1="${b[0]}" y1="${b[1]}" x2="${b[0]+u[0]*900}" y2="${b[1]+u[1]*900}"/>`}
if(P.tri&&W.pts.D&&!W.triSolid)for(const k of["AD","BD"]){const a=W.pts[k[0]],b=W.pts[k[1]];h+=`<line class="seg dot" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`}
for(const k of W.segs){if(hide.includes(k))continue;const a=pos(k[0]),b=pos(k[1]);h+=`<line class="seg ${hc("s",k)} ${W.bold.has(k)?"bold":""}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;if(P.segLabel&&P.segLabel[k])h+=`<text class="lab" x="${(a[0]+b[0])/2}" y="${(a[1]+b[1])/2-12}" text-anchor="middle">${P.segLabel[k]}</text>`}
const d=W.drag;if(d){const a=d.mode==="comp"?W.pts[d.c]:W.pts[d.p];h+=`<line class="seg ${d.mode==="comp"?"h1":"dot"}" x1="${a[0]}" y1="${a[1]}" x2="${d.cur[0]}" y2="${d.cur[1]}"/>`}
for(const id of names()){const p=pos(id),g=grey(id),nl=(P.noLab||[]).includes(id);h+=`<circle class="pt ${g?"grey":""} ${nl?"sm":""} ${P.reveal&&P.reveal.some(r=>r.n===id)?"new":""}" cx="${p[0]}" cy="${p[1]}" r="9"/>`+(nl?"":`<text class="lab ${g?"grey":""}" x="${p[0]+12}" y="${p[1]-12}">${id}</text>`)}
if(W.cap)h+=`<text class="tag" x="320" y="410" text-anchor="middle">${W.cap}</text>`;
svg.innerHTML=h;steps()}
function steps(){$("steps").innerHTML=P.steps.map(s=>`<li class="st ${s[1](W)?"on":""}">${s[0]}</li>`).join("")}
function addSeg(a,b,how){const k=sk(a,b);if(has(W,k))return say("That line is already drawn.");
if(how==="line"&&!P.lineOK.includes(k))return say(P.allowSeg.includes(k)?"Make that line by sliding the first line along the circles, not by drawing it.":"That line isn’t part of this construction, so it disappears.");
if(!P.allowSeg.includes(k))return say("That line isn’t part of this construction, so it disappears.");
W.segs.add(k);say(how==="pivot"?"Good: the line slid along the circle and stayed.":"Line added.");resolve()}
function centres(p){const r=[];for(const k of W.segs)if(k.includes(p))r.push(k.replace(p,""));for(const[o,t]of W.rays){const a=W.pts[o],b=W.pts[t],q=W.pts[p],u=[b[0]-a[0],b[1]-a[1]],v=[q[0]-a[0],q[1]-a[1]];if(Math.abs(u[0]*v[1]-u[1]*v[0])/Math.hypot(...u)<2&&u[0]*v[0]+u[1]*v[1]>0)r.push(o)}return r.filter(c=>P.circ.some(x=>x[0]===c&&x[1]===p))}
function finishCirc(o){const n=o.cov.reduce((a,b)=>a+b,0);if(n>=340&&!o.done){o.cov.fill(1);o.done=true;resolve()}}
function check(){if(W.won||!P.goal(W))return;W.won=true;if(P.id===3){W.segs.add("AE");W.bold.add("AE")}run()}
async function run(){const ph=P.play(W);for(const p of ph){W.hl={c:p.c||[],s:p.s||[],r:p.r||[],hide:p.hide||[],cls:p.cls};say(p.txt);draw();await sleep(2500)}W.hl=null;W.cap=P.prove(W);draw();if(!prog.includes(P.id))markDone();fx("Proved!");say(P.winTxt);$("after").innerHTML=`<p><b>${P.winTxt}</b></p>`}
async function useMacro(){if(W.busy)return;if(P.macro.id===1)return useProp1();return useProp2()}
async function useProp1(){if(W.pts.D&&W.triSolid)return;if(!has(W,"AB"))return say("First draw the line AB so I know where to build the triangle.");W.busy=true;say("Proposition 1 unfolding on AB…");
for(const[x,y]of[["A","B"],["B","A"]]){const c=circObj(x,y);for(let k=0;k<360;k+=FAST?360:12){for(let j=k;j<Math.min(k+12,360);j++)c.cov[j]=1;draw();await sleep(14)}c.cov.fill(1);c.done=true;draw();await sleep(250)}
resolve();draw();await sleep(500);collapse();W.busy=false}
function collapse(){if(!W.pts.D||W.triSolid)return;W.circs=W.circs.filter(c=>!(c.c+">"+c.p==="A>B"||c.c+">"+c.p==="B>A"));W.segs.add("AD");W.segs.add("BD");W.triSolid=true;fx("Prop 1");say("The triangle is solid now. Next, extend DB beyond B and DA beyond A.");draw()}
async function useProp2(){if(W.pts.D)return;W.busy=true;say("Proposition 2 moving line C to A…");const l=dist(W.pts.P,W.pts.Q),a=-40*Math.PI/180;fx("Prop 2");await sleep(900);W.pts.D=[W.pts.A[0]+l*Math.cos(a),W.pts.A[1]+l*Math.sin(a)];W.segs.add("AD");W.busy=false;say("AD is now equal to C. Hold D and sweep it round A.");draw()}
const inTri=(p,a,b,c)=>{const s=(p1,p2,p3)=>(p1[0]-p3[0])*(p2[1]-p3[1])-(p2[0]-p3[0])*(p1[1]-p3[1]),d1=s(p,a,b),d2=s(p,b,c),d3=s(p,c,a);return!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0))};
/* ---- pointer layer ---- */
function xy(e){const r=svg.getBoundingClientRect();return[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*420/r.height]}
function near(p,skip){let b=null,bd=26;for(const id of names()){if(id===skip||grey(id))continue;const d=dist(W.pts[id],p);if(d<bd){bd=d;b=id}}return b}
svg.addEventListener("pointerdown",e=>{if(W.won||W.busy||W.hl)return;const p=xy(e),id=near(p);
if(!id){if(P.tri&&W.pts.D&&!W.triSolid&&inTri(p,W.pts.A,W.pts.B,W.pts.D)){collapse()}return}
svg.setPointerCapture(e.pointerId);if(P.auto)W.tool=has(W,"AB")?"compass":"line";
if(W.tool==="compass"){const c=centres(id)[0];if(!c){say("The compass needs a centre. Draw or extend a line from the centre to this point first.");return}const a=Math.atan2(W.pts[id][1]-W.pts[c][1],W.pts[id][0]-W.pts[c][0]);W.drag={mode:"comp",p:id,c,prev:a,cur:W.pts[id],o:circObj(c,id)};say("Sweep the point all the way round. The line moves along the circle.")}
else W.drag={mode:W.tool,p:id,cur:p};draw()});
svg.addEventListener("pointermove",e=>{const d=W.drag;if(!d)return;const p=xy(e);if(d.mode!=="comp")d.cur=p;else{const o=W.pts[d.c],a=Math.atan2(p[1]-o[1],p[0]-o[0]);let dl=a-d.prev;while(dl>Math.PI)dl-=2*Math.PI;while(dl<-Math.PI)dl+=2*Math.PI;const n=Math.ceil(Math.abs(dl)*180/Math.PI);for(let i=0;i<=n;i++){const t=d.prev+dl*(n?i/n:0);d.o.cov[Math.floor(((t*180/Math.PI)%360+360)%360)]=1}d.prev=a;d.cur=[o[0]+d.o.r*Math.cos(a),o[1]+d.o.r*Math.sin(a)]}draw()});
svg.addEventListener("pointerup",e=>{const d=W.drag;if(!d)return;W.drag=null;const p=xy(e);
if(d.mode==="comp"){finishCirc(d.o);const q=near(p,d.p);if(q&&q!==d.c&&d.o.done&&Math.abs(dist(W.pts[d.c],W.pts[q])-d.o.r)<8)addSeg(d.c,q,"pivot");else say(d.o.done?"Circle done.":"Keep going all the way round.")}
else if(d.mode==="line"){const q=near(p,d.p);if(q)addSeg(d.p,q,"line");else say("Drag from one point to another.")}
else{const o=P.rays.find(r=>r[1]===d.p&&has(W,sk(r[0],r[1])));if(o&&!W.rays.some(r=>r[0]===o[0]&&r[1]===o[1])){const a=W.pts[o[0]],b=W.pts[o[1]],u=[b[0]-a[0],b[1]-a[1]],v=[p[0]-b[0],p[1]-b[1]],dot=(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)||1);if(Math.hypot(...v)>40&&dot>.9){W.rays.push(o);say("Line extended.");resolve()}else say("Pull straight outward along the line.")}else say("Extend a line from the end of a drawn segment, away from the triangle’s top point.")}
draw();check()});
/* ---- UI ---- */
document.addEventListener("click",e=>{const b=e.target.closest("button,[data-node]");if(!b)return;
if(b.dataset.r)return go(b.dataset.r);if(b.dataset.go)return go(+b.dataset.go);if(b.dataset.node)return renderMap(+b.dataset.node);
if(b.dataset.t&&route===P.id){W.tool=b.dataset.t;toolbar();say(b.textContent+" tool selected.");return}
if(b.id==="use")return useMacro();if(b.id==="rn"){W.k++;return renderRead()}if(b.id==="ra"){W.k=P.proof.length;return renderRead()}
if(b.id==="prev"&&cur>0)return go(ALL[cur-1].id);if(b.id==="next"&&cur<ALL.length-1)return go(ALL[cur+1].id);
if(b.id==="reset")return load(P.id);if(b.id==="hint"){const s=P.steps.find(s=>!s[1](W));say(s?s[2]:"You’re done.")}});
$("stage").addEventListener("click",()=>{});
if(typeof NOBOOT==="undefined")go("home");
</script>
