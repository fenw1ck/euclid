"use strict";
/* ============================================================
   Elemental Geometry: the game. Phase 1.
   Title, opening scene, front doors, the Proposition 1 lock,
   the first hall, ten songs with a volume control.
   Everything is drawn in code: no image or sound files.
   ============================================================ */
const cv=document.getElementById("c");let ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener("resize",resize);resize();
const now=()=>performance.now();
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,seg=(t,a,b)=>clamp((t-a)/(b-a));
const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- save ---------- */
const SAVE_KEY="elemGeoGame1";
const S={solved:[],vol:.6,muted:false,track:0,seenIntro:false,coins:0,inv:[],ax:0,vd:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(SAVE_KEY)||"{}"))}catch(e){}

const solved=i=>S.solved.includes(i);

/* ---------- the relationship map (Joyce's lists, as on the site) ---------- */
const USES={1:[],2:[1],3:[2],4:[],5:[3,4],6:[3,4],7:[5],8:[7],9:[1,3,8],10:[1,4,9],11:[1,3,8],12:[8,10],13:[11],14:[13],15:[13],16:[3,4,10,15],17:[13,16],18:[3,5,16],19:[5,18],20:[3,5,19],21:[16,20],22:[3,20],23:[8,22],24:[3,4,5,19,23],25:[4,24],26:[3,4,16],27:[16],28:[13,15,27],29:[13,15],30:[27,29],31:[23,27],32:[13,29,31],33:[4,27,29],34:[4,26,29],35:[4,29,34],36:[33,34,35],37:[31,34,35],38:[31,34,36],39:[31,37],40:[31,38],41:[34,37],42:[10,23,31,38,41],43:[34],44:[15,29,31,42,43],45:[14,29,30,33,34,42,44],46:[3,11,29,31,34],47:[4,14,31,41,46],48:[3,8,11,47]};
const IDS=Object.keys(USES).map(Number);
const KIDS={};IDS.forEach(i=>KIDS[i]=IDS.filter(j=>USES[j].includes(i)));
const DEP={};const depth=i=>DEP[i]||(DEP[i]=1+Math.max(0,...USES[i].map(depth)));
/* a door is open (its proposition is solved), amber (every proposition it needs is solved), or covered */
const doorState=i=>solved(i)?"open":USES[i].every(solved)?"amber":"covered";
const MAP=(()=>{const cols={};IDS.forEach(i=>(cols[depth(i)]=cols[depth(i)]||[]).push(i));const mx=Math.max(...Object.keys(cols).map(Number)),rows=Math.max(...Object.values(cols).map(c=>c.length)),Wd=Math.max(640,mx*60+70),Hd=Math.max(420,rows*36+70),pos={};
for(const d in cols)cols[d].forEach((id,k)=>pos[id]=[38+(d-1)*60-Wd/2,30+(k+.5)*(Hd-60)/cols[d].length-Hd/2]);
const edges=[];IDS.forEach(p=>USES[p].forEach(u=>edges.push([u,p,depth(p)])));edges.sort((a,b)=>a[2]-b[2]);return{pos,edges,Wd,Hd}})();
/* greenhouses join rooms that sit next to each other in one column of the map, so you can cross between branches */
const GH={};IDS.forEach(i=>GH[i]=[]);{const cols={};IDS.forEach(i=>{const x=MAP.pos[i][0];(cols[x]=cols[x]||[]).push(i)});for(const x in cols){const c=cols[x].sort((a,b)=>MAP.pos[a][1]-MAP.pos[b][1]);for(let j=0;j+1<c.length;j++){GH[c[j]].push(c[j+1]);GH[c[j+1]].push(c[j])}}}
/* bridge greenhouses: when a proof that this hall opens still needs one from another branch,
   a greenhouse leads straight to the nearest lock you can open on the way to it */
function needFront(q,seen=new Set()){if(seen.has(q)||solved(q))return[];seen.add(q);if(USES[q].every(solved))return[q];return USES[q].flatMap(u=>needFront(u,seen))}
/* only from the farthest solved room of a branch: one whose own next rooms are all still unsolved */
function bridges(n){if(!solved(n)||KIDS[n].some(solved))return[];const out=new Set();for(const k of KIDS[n]){if(solved(k)||USES[k].every(u=>u===n||solved(u)))continue;for(const u of USES[k])if(u!==n&&!solved(u))needFront(u).forEach(x=>out.add(x))}return[...out].filter(x=>x!==n&&!KIDS[n].includes(x)&&hasLock(x))}
/* greenhouse plants: each greenhouse gets its own few plants from the Planting Guide's list, chosen at random once per game */
const GPICK=(()=>{const L=(window.PLANTS&&PLANTS.list)||[],m={};return id=>{if(!L.length)return[];if(!m[id]){const n=3+Math.floor(Math.random()*2),a=[];while(a.length<n){const p=L[Math.floor(Math.random()*L.length)];if(!a.includes(p))a.push(p)}m[id]=a}return m[id]}})();
const SKY=(()=>{const r=rng(7),a=[];for(let k=0;k<900;k++)a.push([(r()-.5)*MAP.Wd*2.4,(r()-.5)*MAP.Hd*2.4,r()*1.3+.4,r()*6.28,.25+r()*.75]);return a})();

/* ---------- treasure (used from phase 3 on; see the design doc) ---------- */
const ITEMS=[
{id:"scroll-circles",kind:"scroll",name:"Scroll of Circles",price:15,desc:"Light runs ahead of your hand through any lock built from circles (Props 1–3, 22)."},

{id:"cape-indigo",kind:"cape",name:"Indigo Night Cape",price:14,desc:"Dyed the colour of the sky before the stars were joined."},

{id:"starmetal-ax",kind:"tool",name:"Starmetal Ax",price:60,desc:"Forged from a fallen star: three strikes."}];
/* coins in a chest: 1–20, weighted by the proposition number n (1–48). n=1 gives mostly 1–2; n=47 mostly 18–20. */
function coinRoll(n,r=Math.random){const m=1+19*(clamp(n,1,48)-1)/47,sd=1.6,w=[];let tot=0;for(let k=1;k<=20;k++){const x=Math.exp(-((k-m)**2)/(2*sd*sd));w.push(x);tot+=x}let u=r()*tot;for(let k=1;k<=20;k++){u-=w[k-1];if(u<=0)return k}return 20}

/* ---------- audio ---------- */
let ac=null,master,musicBus,sfxBus,NB;
function audioInit(){if(ac){if(ac.state==="suspended")ac.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();
master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
const verb=ac.createConvolver();verb.buffer=impulse(2.6);const vg=ac.createGain();vg.gain.value=.3;verb.connect(vg);vg.connect(master);
musicBus=ac.createGain();musicBus.gain.value=S.muted?0:S.vol*.55;musicBus.connect(master);const ms=ac.createGain();ms.gain.value=.45;musicBus.connect(ms);ms.connect(verb);
sfxBus=ac.createGain();sfxBus.gain.value=.9;sfxBus.connect(master);const ss=ac.createGain();ss.gain.value=.6;sfxBus.connect(ss);ss.connect(verb);
NB=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
setInterval(sched,30);playTrack(S.track)}
function impulse(sec){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2)}return b}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,dur,type,gain,dest,o={}){const a=o.a??.01,r=o.r??.15,sus=Math.max(a,dur),osc=ac.createOscillator(),g=ac.createGain();osc.type=type;osc.frequency.setValueAtTime(f,t);if(o.slide)osc.frequency.exponentialRampToValueAtTime(o.slide,t+sus);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+a);g.gain.setValueAtTime(gain,t+sus);g.gain.exponentialRampToValueAtTime(.0001,t+sus+r);

   20–31 s  the sun and its planets; the Earth swings across our path; the atmosphere; a continent; a mountain
   31–38 s  the temple at dusk, up the great stairs to the doors

const LINES=[[1.2,8.2,"When things are too big, too complex to be understood,"],[9.6,16.6,"we make connections, we simplify,"],[18,24.8,"we go back…"],[26.4,34.2,"to the beginning."]];

/* the road back: from 48, always step to the deepest proposition it relies on that still leads to 1 */
const CHAIN=(()=>{const R={},to1=i=>R[i]??(R[i]=i===1||USES[i].some(to1)),c=[48];while(c[c.length-1]!==1){const k=USES[c[c.length-1]].filter(to1);c.push(k.reduce((a,b)=>depth(b)>depth(a)?b:a))}
const P=c.map(i=>MAP.pos[i]),L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+dist(P[i-1],P[i]));return{ids:c,P,L,tot:L[L.length-1]}})();

const na=seg(t,0,2.5),passed=new Set(CHAIN.ids.filter((id,i)=>trav>=CHAIN.L[i]));for(const id of IDS){const q=P[id];let r=(1.5+(t>6.5?seg(t,6.5,8.5)*1.3:0))/s,a=na,c=passed.has(id)?[255,222,150]:[215,228,255];
if(id!==1&&t>17.5)a*=1-seg(t,17.5,19);if(id===1&&t>15){c=[255,222,150];const v=seg(t,17.5,20);r=(2.9+Math.pow(v,3)*Math.max(W,H)*1.2)/s}
glow(q[0],q[1],r*4,a*.8,c);ctx.fillStyle=`rgba(255,255,250,${a})`;circ(q[0],q[1],r);ctx.fill()}

 <p class="bn" style="margin-top:10px">Sell (half price)</p><div class="bgrid">${sell.length?sell.map(([id],j)=>`<button class="bslot${SHOPSEL&&SHOPSEL.s===j?" sel":""}" data-s="${j}"><canvas width="96" height="96"></canvas><em>${Math.floor((itemById(id).price||0)/2)}</em></button>`).join(""):`<span class="bn">Your bag is empty.</span>`}</div><div class="bdet" id="bdet"></div>`;
 itemCanvas("#bag [data-b] canvas",stock);itemCanvas("#bag [data-s] canvas",sell.map(x=>x[0]));document.getElementById("bagx").onclick=bagClose;
 box.onpointerdown=box.onpointermove=box.onpointerup=box.onpointercancel=null;
 box.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{SHOPSEL={b:+b.dataset.b};renderBag()});box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{SHOPSEL={s:+b.dataset.s};renderBag()});
 const d=document.getElementById("bdet");if(!SHOPSEL){d.innerHTML=`<p class="bn">The statue glows blue. It sells boots and scrolls, buys anything at half price, and will sell back what you sold it.</p>`;return}
 if(SHOPSEL.b!=null){const id=stock[SHOPSEL.b],it=itemById(id);d.innerHTML=`<h3>${esc(it.name)}</h3><p class="bn">${coinsTxt(it.price)}${it.speed?` · walking speed ×${it.speed}`:""}${S.sold.includes(id)?" · you sold this":""}</p><p>${esc(it.desc)}</p><div class="bbtn"><button class="btn" id="bbuy">Buy</button></div>`;document.getElementById("bbuy").onclick=()=>shopBuy(id)}
 else{const[id,i]=sell[SHOPSEL.s],it=itemById(id);d.innerHTML=`<h3>${esc(it.name)}</h3><p class="bn">sells for ${coinsTxt(Math.floor((it.price||0)/2))}</p><p>${esc(it.desc)}</p><div class="bbtn"><button class="btn" id="bsell">Sell</button></div>`;document.getElementById("bsell").onclick=()=>shopSell(i)}}

/* ---------- input ---------- */
function begin(){audioInit();document.getElementById("menu").style.display="none";go("intro")}
cv.addEventListener("pointerdown",e=>{const x=e.clientX,y=e.clientY;audioInit();if(fade)return;
if(scene==="title"){if(!hasProgress())begin();return}if(scene==="green")return greenTap(x,y);if(scene==="intro")return endIntro();if(scene==="map")return mapTap(x,y);
if(scene==="doors"){if(axSpotHit(x,y))return takeAx();const D=doorLayout();if(y<D.y0||y>D.y0+D.dh||x<D.x0||x>D.x0+D.tw){if(HOLD){HOLD=null;toast("You put the flask away.")}return}const id=x<D.x0+D.lw?1:4;
if(vined(id)){const ox=D.x0+(id===1?0:D.lw);if(HOLD)return pour(id,x,y,(u,v)=>[ox+u*D.lw,D.y0+v*D.dh],false);return chopTap(id,x,y,(u,v)=>[ox+u*D.lw,D.y0+v*D.dh],false)}
if(!solved(id))return openLock(id);if(doorOpenAmt(id)>=1){hallStack=[];enterHall(id)}return}
if(scene==="lock"){cv.setPointerCapture(e.pointerId);return lockId===4?l4Down(x,y):FIGS[lockId]?figDown(x,y):lkDown(x,y)}
if(scene==="hall"){if(BP){BP=null;return}if(PLQ){hidePlaque();return}{const hb=hallHits.find(h=>h.kind==="item"&&h.it.hidden&&inPoly([x,y],h.poly));if(hb){itemTap(hb.it);return}}
if(HOLD){for(let i=hallHits.length-1;i>=0;i--){const h=hallHits[i];if(!inPoly([x,y],h.poly))continue;if(h.kind==="door"&&h.st!=="open"&&vined(h.id)&&HOLD.id!=="soil")return pour(h.id,x,y,h.map,h.st!=="amber");if(h.kind==="plant")return HOLD.id==="soil"?pourSoil(h):S.dead[h.key]?toast("It's already dead."):pourPlant(h.key)}HOLD=null;toast("You put the flask away.");return}for(let i=hallHits.length-1;i>=0;i--){const h=hallHits[i];if(!inPoly([x,y],h.poly))continue;if(h.kind==="item"){itemTap(h.it);return}if(h.kind==="shop"){shopOpen();return}if(h.kind==="plant"){plantTap(h);return}if(h.kind==="mind"){showPlaque(h.who);return}if(h.kind==="art"){const T=now();if(artTap.id===h.id&&T-artTap.t<450){BP={id:h.id,t0:T};document.getElementById("toast").style.opacity=0;artTap={id:null,t:0};sfxChime(false)}else{artTap={id:h.id,t:T};if(!S.bpHint){S.bpHint=1;save();toast("Double-tap a painting to see its blueprint.")}}return}if(h.kind==="door"&&h.st!=="open"&&vined(h.id)){chopTap(h.id,x,y,h.map,h.st!=="amber");return}if(h.st==="amber"){if(hasLock(h.id))openLock(h.id);else{sfxChime(false);toast("This lock is still being made.")}}else if(h.st==="open")enterHall(h.id);else if(h.st==="covered"){sfxRattle();toast("Its lock is covered.")}return}hallFloorTap(x,y)}});
cv.addEventListener("pointermove",e=>{if(scene==="lock")(lockId===4?l4Move:FIGS[lockId]?figMove:lkMove)(e.clientX,e.clientY);else if(e.pointerType==="mouse")axCursor(e.clientX,e.clientY)});
cv.addEventListener("pointerup",e=>{if(scene==="lock")(lockId===4?l4Up:FIGS[lockId]?figUp:lkUp)(e.clientX,e.clientY)});
cv.addEventListener("pointercancel",()=>{if(scene==="lock"){LK.drag=null;LK4.drag=null;if(LKF){LKF.drag=null;LKF.ghost=null;LKF.ext=null}if(LK4.ghost&&LK4.ghost.t!=="t")LK4.ghost=null}});
addEventListener("keydown",e=>{if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"))return;audioInit();if(scene==="title"){if(!hasProgress())begin();else if(e.key==="Enter")contGame()}else if(scene==="intro")endIntro()});
document.getElementById("back").addEventListener("click",()=>{if(scene==="green"){if(GHS)hallId=GHS.from;fadeTo("hall",600);return}if(scene==="lock")fadeTo(lockFrom,600);else if(scene==="hall"){hallStack.pop();if(hallStack.length){hallId=hallStack[hallStack.length-1];CAM={x:0,z:0,target:null};fadeTo("hall",600)}else fadeTo("doors",600)}});
document.getElementById("replay").addEventListener("click",()=>{audioInit();fade=null;go("intro")});
function contGame(){audioInit();hallStack=[];fadeTo("doors",800)}
document.getElementById("cont").addEventListener("click",contGame);
const newB=document.getElementById("newg");let newArm=-1e9;
newB.addEventListener("click",()=>{audioInit();if(now()-newArm>3500){newArm=now();newB.textContent="Erase progress?";setTimeout(()=>newB.textContent="Start over",3500);return}
S.solved=[];S.coins=0;S.inv=[];S.ax=0;S.vd={};S.rooms={};S.taken={};S.opened={};S.drops={};S.got={};S.worn={};S.sold=[];S.dead={};S.grow={};S.hill={};S.picked={};HOLD=null;save();VC.clear();doorOpenT={1:null,4:null};hallStack=[];newB.textContent="Start over";begin()});
document.getElementById("relock").addEventListener("click",()=>{if(scene==="hall"&&hasLock(hallId))openLock(hallId)});
document.getElementById("help").addEventListener("click",()=>{if(scene==="lock"&&EMB){lockF.contentWindow.postMessage({cmd:"step"},"*");return}if(scene==="lock")HELP={t0:now(),path:helpPath()}});
document.getElementById("bagb").addEventListener("click",()=>{audioInit();const b=document.getElementById("bag");if(b.style.display==="block")bagClose();else bagOpen()});
document.getElementById("toolb").addEventListener("click",()=>{audioInit();if(PLQ)hidePlaque();else axCard()});
document.getElementById("mapb").addEventListener("click",()=>{audioInit();if(scene==="map")fadeTo(mapPrev,500);else{mapPrev=scene;fadeTo("map",500)}});
go("title");requestAnimationFrame(frame);
</script>
