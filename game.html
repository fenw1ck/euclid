<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elemental Geometry: The Game</title>
<style>
html,body{margin:0;height:100%;background:#05060c;overflow:hidden;touch-action:none;color:#f3e6c4;font-family:Georgia,"Times New Roman",serif;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}

.btn{background:rgba(20,16,10,.55);border:1px solid rgba(230,190,110,.45);color:#f3e6c4;border-radius:10px;padding:7px 11px;font:600 14px system-ui,sans-serif;cursor:pointer;text-decoration:none;line-height:1.2}
#music{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:6px;background:rgba(20,16,10,.62);border:1px solid rgba(230,190,110,.4);border-radius:12px;padding:5px 7px;font:13px system-ui,sans-serif}

@media (max-width:520px){#music select{max-width:92px}#music input{width:60px}}
</style>

<body>
<canvas id="c"></canvas>
<div id="hud"><a class="btn" href="index.html" title="Back to Elemental Geometry">‹ Site</a><button class="btn" id="back" style="display:none" title="Step back">‹ Back</button><button class="btn" id="replay" title="Watch the opening again">↺ Intro</button></div>
<div id="music"><button class="btn" id="mute" title="Music on or off" aria-label="Music on or off">♪</button><select id="track" aria-label="Song"></select><button class="btn" id="nexttr" title="Next song" aria-label="Next song">⏭</button><input id="vol" type="range" min="0" max="1" step="0.01" aria-label="Music volume"></div>
<div id="toast"></div>
<script>
"use strict";
/* ============================================================
   Elemental Geometry: the game. Phase 1.
   Title, opening scene, front doors, the Proposition 1 lock,
   the first hall, ten songs with a volume control.
   Everything is drawn in code: no image or sound files.
   ============================================================ */
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener("resize",resize);resize();
const now=()=>performance.now();
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,seg=(t,a,b)=>clamp((t-a)/(b-a));
const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- save ---------- */
const SAVE_KEY="elemGeoGame1";
const S={solved:[],vol:.6,muted:false,track:0,seenIntro:false,coins:0,inv:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem(SAVE_KEY)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
const solved=i=>S.solved.includes(i);

/* ---------- the relationship map (Joyce's lists, as on the site) ---------- */
const USES={1:[],2:[1],3:[2],4:[],5:[3,4],6:[3,4],7:[5],8:[7],9:[1,3,8],10:[1,4,9],11:[1,3,8],12:[8,10],13:[11],14:[13],15:[13],16:[3,4,10,15],17:[13,16],18:[3,5,16],19:[5,18],20:[3,5,19],21:[16,20],22:[3,20],23:[8,22],24:[3,4,5,19,23],25:[4,24],26:[3,4,16],27:[16],28:[13,15,27],29:[13,15],30:[27,29],31:[23,27],32:[13,29,31],33:[4,27,29],34:[4,26,29],35:[4,29,34],36:[33,34,35],37:[31,34,35],38:[31,34,36],39:[31,37],40:[31,38],41:[34,37],42:[10,23,31,38,41],43:[34],44:[15,29,31,42,43],45:[14,29,30,33,34,42,44],46:[3,11,29,31,34],47:[4,14,31,41,46],48:[3,8,11,47]};
const IDS=Object.keys(USES).map(Number);
const KIDS={};IDS.forEach(i=>KIDS[i]=IDS.filter(j=>USES[j].includes(i)));
const DEP={};const depth=i=>DEP[i]||(DEP[i]=1+Math.max(0,...USES[i].map(depth)));
/* a door is open (its proposition is solved), amber (every proposition it needs is solved), or covered */
const doorState=i=>solved(i)?"open":USES[i].every(solved)?"amber":"covered";
const MAP=(()=>{const cols={};IDS.forEach(i=>(cols[depth(i)]=cols[depth(i)]||[]).push(i));const mx=Math.max(...Object.keys(cols).map(Number)),rows=Math.max(...Object.values(cols).map(c=>c.length)),Wd=Math.max(640,mx*60+70),Hd=Math.max(420,rows*36+70),pos={};
for(const d in cols)cols[d].forEach((id,k)=>pos[id]=[38+(d-1)*60-Wd/2,30+(k+.5)*(Hd-60)/cols[d].length-Hd/2]);
const edges=[];IDS.forEach(p=>USES[p].forEach(u=>edges.push([u,p,depth(p)])));edges.sort((a,b)=>a[2]-b[2]);return{pos,edges,Wd,Hd}})();
const SKY=(()=>{const r=rng(7),a=[];for(let k=0;k<900;k++)a.push([(r()-.5)*MAP.Wd*2.4,(r()-.5)*MAP.Hd*2.4,r()*1.3+.4,r()*6.28,.25+r()*.75]);return a})();

/* ---------- treasure (used from phase 3 on; see the design doc) ---------- */
const ITEMS=[
{id:"scroll-circles",kind:"scroll",name:"Scroll of Circles",price:15,desc:"Light runs ahead of your hand through any lock built from circles (Props 1–3, 22)."},
{id:"scroll-lines",kind:"scroll",name:"Scroll of the Straightedge",price:15,desc:"Shows each cut and join before you make it, for the line locks (Props 9–12)."},
{id:"scroll-angles",kind:"scroll",name:"Scroll of Angles",price:20,desc:"Guides the hand through the angle locks (Props 13–26)."},
{id:"scroll-parallels",kind:"scroll",name:"Scroll of Parallels",price:25,desc:"Traces the lines that never meet (Props 27–34)."},
{id:"scroll-areas",kind:"scroll",name:"Scroll of Equal Areas",price:30,desc:"Shows which shape slides onto which (Props 35–45)."},
{id:"scroll-squares",kind:"scroll",name:"Scroll of Squares",price:40,desc:"The last three locks, step by glowing step (Props 46–48)."},
{id:"necklace-lapis",kind:"necklace",name:"Lapis Pendant",price:12,desc:"A blue stone cut as a perfect hexagon on a braided cord."},
{id:"necklace-gold",kind:"necklace",name:"Golden Ratio Torc",price:30,desc:"A neck ring whose spirals grow by the same proportion every turn."},
{id:"sword-bronze",kind:"sword",name:"Bronze Gnomon Blade",price:18,desc:"Its blade casts a shadow that tells the hour. Ornamental, and sharp only in theory."},
{id:"sword-star",kind:"sword",name:"Starmetal Sword",price:40,desc:"Forged from a fallen star; its edge is a perfectly straight line."},
{id:"boots-sandals",kind:"boots",name:"Scholar's Sandals",price:8,desc:"Worn smooth by a thousand walks between the columns."},
{id:"boots-greaves",kind:"boots",name:"Greaves of the Long Stair",price:22,desc:"Bronze shin guards etched with a staircase of squares."},
{id:"cape-indigo",kind:"cape",name:"Indigo Night Cape",price:14,desc:"Dyed the colour of the sky before the stars were joined."},
{id:"cape-constellation",kind:"cape",name:"Constellation Cloak",price:35,desc:"Its stitching maps the 48 stars and every line between them."},
{id:"gloves-linen",kind:"gloves",name:"Linen Drafting Gloves",price:6,desc:"Keep the chalk off your fingers and the fingers off the chalk."},
{id:"gloves-gilded",kind:"gloves",name:"Gilded Gauntlets",price:28,desc:"The fingertips glow faintly gold, as if they remember every figure."},
{id:"crown-laurel",kind:"crown",name:"Laurel Wreath",price:10,desc:"Given to those who prove what others only suspect."},
{id:"crown-elements",kind:"crown",name:"Crown of the Elements",price:60,desc:"Five points for five postulates. Found only in the deepest halls."},
{id:"chalice",kind:"treasure",name:"Silver Chalice",price:16,desc:"Its rim is a perfect circle; its stem, a perfect line."},
{id:"astrolabe",kind:"treasure",name:"Brass Astrolabe",price:34,desc:"Turn the rings and the stars line up, much as they did at the gate."},
{id:"compass",kind:"treasure",name:"Iron Compass",price:20,desc:"A drawing compass that collapses when lifted, just as Euclid's did."},
{id:"straightedge",kind:"treasure",name:"Ebony Straightedge",price:20,desc:"No markings at all. It can join, but it cannot measure."},
{id:"lyre",kind:"treasure",name:"Tortoiseshell Lyre",price:26,desc:"Its strings are tuned in whole-number ratios."},
{id:"tile",kind:"treasure",name:"Mosaic Tile",price:5,desc:"A single blue triangle from a floor long since buried."},
{id:"amphora",kind:"treasure",name:"Painted Amphora",price:14,desc:"Black figures walk around it, forever drawing circles."},
{id:"lamp",kind:"treasure",name:"Bronze Oil Lamp",price:9,desc:"Still holds a little oil. It smells of old libraries."},
{id:"ring",kind:"treasure",name:"Signet Ring",price:24,desc:"The seal is a triangle inside a circle inside a square."},
{id:"map",kind:"treasure",name:"Papyrus Map",price:18,desc:"A plan of the halls, though some corridors are drawn where none exist yet."},
{id:"bust",kind:"treasure",name:"Marble Bust Fragment",price:30,desc:"A bearded face, chipped at the nose. Possibly a geometer."},
{id:"hourglass",kind:"treasure",name:"Glass Hourglass",price:22,desc:"The sand falls in a perfect cone, every time."}];
/* coins in a chest: 1–20, weighted by the proposition number n (1–48). n=1 gives mostly 1–2; n=47 mostly 18–20. */
function coinRoll(n,r=Math.random){const m=1+19*(clamp(n,1,48)-1)/47,sd=1.6,w=[];let tot=0;for(let k=1;k<=20;k++){const x=Math.exp(-((k-m)**2)/(2*sd*sd));w.push(x);tot+=x}let u=r()*tot;for(let k=1;k<=20;k++){u-=w[k-1];if(u<=0)return k}return 20}

/* ---------- audio ---------- */
let ac=null,master,musicBus,sfxBus,NB;
function audioInit(){if(ac){if(ac.state==="suspended")ac.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();
master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
const verb=ac.createConvolver();verb.buffer=impulse(2.6);const vg=ac.createGain();vg.gain.value=.3;verb.connect(vg);vg.connect(master);
musicBus=ac.createGain();musicBus.gain.value=S.muted?0:S.vol*.55;musicBus.connect(master);const ms=ac.createGain();ms.gain.value=.45;musicBus.connect(ms);ms.connect(verb);
sfxBus=ac.createGain();sfxBus.gain.value=.9;sfxBus.connect(master);const ss=ac.createGain();ss.gain.value=.6;sfxBus.connect(ss);ss.connect(verb);
NB=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
setInterval(sched,30);playTrack(S.track)}
function impulse(sec){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2)}return b}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,dur,type,gain,dest,o={}){const a=o.a??.01,r=o.r??.15,sus=Math.max(a,dur),osc=ac.createOscillator(),g=ac.createGain();osc.type=type;osc.frequency.setValueAtTime(f,t);if(o.slide)osc.frequency.exponentialRampToValueAtTime(o.slide,t+sus);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+a);g.gain.setValueAtTime(gain,t+sus);g.gain.exponentialRampToValueAtTime(.0001,t+sus+r);
let n=osc;if(o.cut){const fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.value=o.cut;osc.connect(fl);n=fl}n.connect(g);g.connect(dest);osc.start(t);osc.stop(t+sus+r+.05)}
function noiseHit(t,dur,gain,type,freq,dest,q=1){const s=ac.createBufferSource();s.buffer=NB;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
function kick(t,dest){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);g.gain.setValueAtTime(.42,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.3)}

/* ten songs: dungeon crawling, but bright. Each is composed from a seed when it is first played. */
const MODES={ion:[0,2,4,5,7,9,11],mix:[0,2,4,5,7,9,10],dor:[0,2,3,5,7,9,10],lyd:[0,2,4,6,7,9,11]};
const TRACKS=[
{name:"The First Postulate",bpm:108,root:60,mode:"ion",prog:[0,4,5,3],lead:"square",drums:1,arp:1,seed:1},
{name:"Lantern Corridor",bpm:96,root:62,mode:"dor",prog:[0,3,0,6],lead:"triangle",drums:1,arp:1,seed:2},
{name:"Compass and Ivy",bpm:118,root:55,mode:"mix",prog:[0,6,3,0],lead:"square",drums:2,arp:0,seed:3},
{name:"Gnomon's March",bpm:112,root:53,mode:"ion",prog:[0,3,4,0],lead:"sawtooth",drums:2,arp:0,seed:4},
{name:"The Greenhouse Fountain",bpm:86,root:52,mode:"lyd",prog:[0,1,0,4],lead:"triangle",drums:0,arp:1,seed:5},
{name:"Parallel Halls",bpm:124,root:57,mode:"dor",prog:[0,3,0,6],lead:"square",drums:2,arp:1,seed:6},
{name:"The Gilded Theorem",bpm:100,root:58,mode:"ion",prog:[0,5,3,4],lead:"triangle",drums:1,arp:0,seed:7},
{name:"Stairs of Alexandria",bpm:132,root:50,mode:"mix",prog:[0,6,3,0],lead:"square",drums:2,arp:1,seed:8},
{name:"Byrne's Colours",bpm:92,root:60,mode:"lyd",prog:[0,1,0,4],lead:"triangle",drums:1,arp:1,seed:9},
{name:"Q.E.D.",bpm:140,root:55,mode:"ion",prog:[0,4,5,3],lead:"square",drums:2,arp:0,seed:10}];
const BUILT={};
function build(D){if(BUILT[D.name])return BUILT[D.name];const R=rng(D.seed*7919+17),M=MODES[D.mode],N=i=>D.root+M[((i%7)+7)%7]+12*Math.floor(i/7);
const rot=D.prog.slice(2).concat(D.prog.slice(0,2)),chords=[];for(let b=0;b<16;b++)chords.push(b>=8&&b<12?rot[b%4]:D.prog[b%4]);
const RH=[[0,4,6,8,12],[0,2,4,8,10,12,14],[0,3,6,8,12],[0,4,8,10,12,14],[0,6,8,12],[0,2,4,6,8,12],[0,4,7,8,11,12],[0,8,10,12,14]];
const nearest=(ch,cur)=>{let b=null;for(const o of[0,7,14])for(const x of[0,2,4]){const c=ch+x+o;if(b===null||Math.abs(c-cur)<Math.abs(b-cur))b=c}return b};
function phrase(prog,hi){const ev=[],r1=RH[Math.floor(R()*RH.length)],r2=RH[Math.floor(R()*RH.length)],base=hi?10:7;let cur=prog[0]+base;
for(let b=0;b<4;b++){const ch=prog[b],rh=b%2?r2:r1;for(let k=0;k<rh.length;k++){const s=rh[k],nx=k+1<rh.length?rh[k+1]:16,last=b===3&&k===rh.length-1;let idx;
if(s%8===0||last)idx=nearest(ch,cur);else idx=cur+[-2,-1,-1,1,1,2,0,3,-3][Math.floor(R()*9)];
idx=Math.max(base-2,Math.min(base+10,idx));if(last)idx=nearest(ch,cur)-((nearest(ch,cur)-ch)%7===0?0:0);cur=idx;ev.push([b*16+s,idx,Math.max(1,Math.min(nx-s,6))])}}return ev}
const A=phrase(D.prog,false),B=phrase(rot,true),mel=Array.from({length:256},()=>[]),sh=D.root>=57?-12:0;
const put=(ev,bar0)=>ev.forEach(([s,i,d])=>mel[bar0*16+s].push([N(i)+sh,d]));put(A,0);put(A,4);put(B,8);put(A,12);
const BP=[[0,8],[0,6,8,14],[0,3,8,11],[0,8,10]][Math.floor(R()*4)];return BUILT[D.name]={...D,len:256,chords,mel,BP,N}}
const SEQ={T:null,step:0,next:0,loops:0};
function playTrack(i){S.track=((i%TRACKS.length)+TRACKS.length)%TRACKS.length;save();SEQ.T=build(TRACKS[S.track]);SEQ.step=0;SEQ.loops=0;if(ac)SEQ.next=ac.currentTime+.1;trSel.value=S.track}
function sched(){if(!SEQ.T||!ac)return;const T=SEQ.T,spb=60/T.bpm/4;if(SEQ.next<ac.currentTime-.25)SEQ.next=ac.currentTime+.05;
while(SEQ.next<ac.currentTime+.15){playStep(T,SEQ.step,SEQ.next,spb);SEQ.next+=spb;SEQ.step++;if(SEQ.step>=T.len){SEQ.step=0;if(++SEQ.loops>=2){playTrack(S.track+1);return}}}}
function playStep(T,st,t,spb){const bar=st>>4,s=st&15,ch=T.chords[bar],N=T.N,out=musicBus;
if(s===0)for(const x of[0,2,4])tone(mtof(N(ch+x)+(T.root<55?12:0)),t,spb*15,"sawtooth",.016,out,{a:.25,r:.5,cut:900});
if(T.BP.includes(s))tone(mtof(N(ch)-24+(T.root<52?12:0)),t,spb*1.8,"triangle",.16,out,{a:.005,r:.08});
if(T.arp&&s%2===0){const k=[0,2,4,7][(s>>1)%4];tone(mtof(N(ch+k)+12-(T.root>=57?12:0)),t,spb*1.2,"sine",.032,out,{a:.004,r:.12})}
for(const[m,d]of T.mel[st])tone(mtof(m),t,spb*d*.9,T.lead,T.lead==="square"?.038:T.lead==="sawtooth"?.032:.07,out,{a:.008,r:.12,cut:T.lead==="triangle"?0:2400});
if(T.drums){if(s===0||s===8||(T.drums>1&&s===10&&bar%2))kick(t,out);if(s%2===0)noiseHit(t,.04,s%4===2?.045:.022,"highpass",7000,out);if(T.drums>1&&(s===4||s===12))noiseHit(t,.14,.08,"bandpass",1800,out,.8)}}
function setVol(){if(ac)musicBus.gain.setTargetAtTime(S.muted?0:S.vol*.55,ac.currentTime,.05);muteB.style.opacity=S.muted?.45:1}

/* sound effects */
function sfxChime(hi){if(!ac)return;const t=ac.currentTime+.01,b=hi?79:72;[0,4,7,12].forEach((x,i)=>tone(mtof(b+x),t+i*.07,.05,"sine",.11,sfxBus,{a:.004,r:.9}))}
function sfxTick(){if(!ac)return;tone(mtof(91+Math.floor(Math.random()*5)),ac.currentTime,.01,"sine",.025,sfxBus,{a:.002,r:.2})}
function sfxRattle(){if(!ac)return;const t=ac.currentTime+.01;[0,.09,.21].forEach((d,i)=>{noiseHit(t+d,.08,.35,"bandpass",3200-i*400,sfxBus,5);tone(700-i*90,t+d,.02,"square",.03,sfxBus,{a:.001,r:.06})})}
/* tumbling locks, the bolt, then creaking hinges and the door coming to rest */
function sfxUnlock(){if(!ac)return;const t=ac.currentTime+.05;
[0,.2,.36,.48,.57,.64].forEach((d,i)=>{noiseHit(t+d,.045,.5,"bandpass",2200+i*260,sfxBus,9);tone(1500+i*140,t+d,.015,"square",.03,sfxBus,{a:.001,r:.04})});
noiseHit(t+.85,.3,.8,"lowpass",500,sfxBus);tone(120,t+.85,.12,"sine",.5,sfxBus,{a:.002,r:.2,slide:45});
const c=t+1.15,d=2.6,o=ac.createOscillator(),bp=ac.createBiquadFilter(),pk=ac.createBiquadFilter(),g=ac.createGain();o.type="sawtooth";
const n=64,fc=new Float32Array(n),bc=new Float32Array(n);let v=38;for(let i=0;i<n;i++){v=clamp(v+(Math.random()-.5)*14,22,75);fc[i]=v;bc[i]=700+Math.sin(i*.4)*250+Math.random()*200}
o.frequency.setValueCurveAtTime(fc,c,d);bp.type="bandpass";bp.Q.value=7;bp.frequency.setValueCurveAtTime(bc,c,d);pk.type="peaking";pk.frequency.value=1400;pk.gain.value=8;pk.Q.value=3;
g.gain.setValueAtTime(0,c);g.gain.linearRampToValueAtTime(.35,c+.3);g.gain.setValueAtTime(.3,c+d-.6);g.gain.linearRampToValueAtTime(0,c+d);
o.connect(bp);bp.connect(pk);pk.connect(g);g.connect(sfxBus);o.start(c);o.stop(c+d+.05);
noiseHit(c+d-.1,.45,.5,"lowpass",250,sfxBus);tone(70,c+d-.1,.15,"sine",.4,sfxBus,{a:.003,r:.3,slide:40})}

/* ---------- music widget ---------- */
const trSel=document.getElementById("track"),muteB=document.getElementById("mute"),volI=document.getElementById("vol");
TRACKS.forEach((t,i)=>{const o=document.createElement("option");o.value=i;o.textContent=t.name;trSel.appendChild(o)});trSel.value=S.track;volI.value=S.vol;setVol();
trSel.addEventListener("change",()=>{audioInit();playTrack(+trSel.value)});
document.getElementById("nexttr").addEventListener("click",()=>{audioInit();playTrack(S.track+1)});
muteB.addEventListener("click",()=>{audioInit();S.muted=!S.muted;save();setVol()});
volI.addEventListener("input",()=>{audioInit();S.vol=+volI.value;if(S.muted&&S.vol>0)S.muted=false;save();setVol()});
let toastT;function toast(m){const e=document.getElementById("toast");e.textContent=m;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,2600)}

/* ---------- drawing helpers ---------- */

/* what to touch next pulses */
if(live&&!lk.drag&&!lk.anim){const t=T/1000,pb=R*.035,st=l4Next(lk),mid=(a,b)=>{const p=Q(a),q=Q(b);return[(p[0]+q[0])/2,(p[1]+q[1])/2]};
if(st==="AC"||st==="AB")L4SIDE[st].forEach(([a,b],i)=>pulse(...mid(a,b),pb,t+i*.5));
else if(st==="A"){pulse(...Q("A"),pb,t);pulse(...Q("D"),pb,t+.5)}
else if(st==="slide"){const g=lk.ghost,ps=g?Object.values(g.pts):["A","B","C"].map(n=>L4[n]),c=[(ps[0][0]+ps[1][0]+ps[2][0])/3,(ps[0][1]+ps[1][1]+ps[2][1])/3];pulse(...P(c),pb,t);if(g&&g.pivot)pulse(...P(g.pts[g.pivot]),pb,t+.5)}}}
function l4Down(x,y){const lk=LK4;if(lk.won||lk.anim)return;const p=toLocal(x,y),{R}=lockGeo(),hit=Math.max(.08,24/R),st=l4Next(lk);let d=null;
if(st==="AC"||st==="AB"){for(const[i,j]of[[0,1],[1,0]]){const[a,b]=L4SIDE[st][i];if(segD(p,L4[a],L4[b])<hit){d={k:st,tgt:L4SIDE[st][j],start:p,base:[L4[a].slice(),L4[b].slice()]};lk.ghost={t:"s",p:L4[a].slice(),q:L4[b].slice()};break}}}
else if(st==="A"){for(const[v,w]of[["A","D"],["D","A"]])if(dist(p,L4[v])<hit*1.6){lk.ghost=wedgeOf(v);d={k:"A",tgt:w,start:p,V0:L4[v].slice()};break}}
else if(st==="slide"){const g=lk.ghost;if(g&&inPoly(p,Object.values(g.pts)))d={k:"slide",last:p};
else for(const tri of["ABC","DEF"]){const ks=tri.split("");if(inPoly(p,ks.map(k=>L4[k]))){lk.ghost={t:"t",pts:Object.fromEntries(ks.map(k=>[k,L4[k].slice()])),pivot:null};d={k:"slide",last:p};break}}}
if(!d)return;lk.drag=d;lk.tip=p.slice();lk.trail.push({p:p.slice(),t:now(),brk:true})}
function l4Move(x,y){const lk=LK4,d=lk.drag;if(!d)return;const p=toLocal(x,y),g=lk.ghost;lk.tip=p.slice();lk.trail.push({p:p.slice(),t:now()});
if(d.k==="AC"||d.k==="AB"){const o=[p[0]-d.start[0],p[1]-d.start[1]];g.p=[d.base[0][0]+o[0],d.base[0][1]+o[1]];g.q=[d.base[1][0]+o[0],d.base[1][1]+o[1]];return}
if(d.k==="A"){g.V=[d.V0[0]+p[0]-d.start[0],d.V0[1]+p[1]-d.start[1]];return}
const ks=Object.keys(g.pts);
if(!g.pivot){const dl=[p[0]-d.last[0],p[1]-d.last[1]];for(const k of ks){g.pts[k][0]+=dl[0];g.pts[k][1]+=dl[1]}let best=null,bd=1e9;for(const k of ks){const dd=dist(g.pts[k],L4[PART[k]]);if(dd<bd){bd=dd;best=k}}
if(bd<.07){const t=L4[PART[best]],sh=[t[0]-g.pts[best][0],t[1]-g.pts[best][1]];for(const k of ks){g.pts[k][0]+=sh[0];g.pts[k][1]+=sh[1]}g.pivot=best;sfxTick()}}
else{const c=g.pts[g.pivot],da=wrapA(ang2(c,p)-ang2(c,d.last));if(dist(p,c)>.06)for(const k of ks)if(k!==g.pivot)g.pts[k]=rot2(g.pts[k],c,da);if(Math.random()<.15)sfxTick();
for(const k of ks){if(k===g.pivot||dist(g.pts[k],L4[PART[k]])>.05)continue;const th=wrapA(ang2(c,L4[PART[k]])-ang2(c,g.pts[k]));for(const j of ks)if(j!==g.pivot)g.pts[j]=rot2(g.pts[j],c,th);lk.drag=null;win4();break}}
d.last=p}
function l4Up(x,y){const lk=LK4,d=lk.drag;if(!d)return;lk.drag=null;const g=lk.ghost;if(d.k==="slide")return;
const snap=(to,dur,done)=>{lk.anim={f:JSON.parse(JSON.stringify(g)),to,t0:now(),dur,done}};
if(d.k==="AC"||d.k==="AB"){const T=d.tgt.map(n=>L4[n]),m=[(g.p[0]+g.q[0])/2,(g.p[1]+g.q[1])/2],mt=[(T[0][0]+T[1][0])/2,(T[0][1]+T[1][1])/2];
if(dist(m,mt)<.16)snap({p:T[0],q:T[1]},280,()=>{lk[d.k]=now();lk.ghost=null;sfxChime(false)});else lk.ghost=null;return}
const T=wedgeOf(d.tgt);if(dist(g.V,T.V)<.16)snap(T,320,()=>{lk.ang=now();lk.ghost=null;sfxChime(false);setTimeout(()=>{lk.BC=now();sfxChime(true)},450)});else lk.ghost=null}
function win4(){const T=now();LK4.won=T;LK4.ghost=null;setTimeout(()=>sfxChime(true),200);
if(!solved(4)){S.solved.push(4);save()}setTimeout(()=>{sfxUnlock();doorOpenT[4]=null;fadeTo("doors",900,()=>{doorOpenT[4]=now()+700})},1900)}
function openLock(id){lockId=id;if(id===4)LK4=mkLock4();else LK=mkLock();fadeTo("lock",700)}

/* ---------- halls ---------- */
let hallHits=[],hallId=1;
/* one door for each proposition that relies on this one, nearest first, alternating walls and kept clear of the torch pillars */
function hallSlots(n){if(n<=6)return[[-1,2.4],[1,3.3],[-1,6.4],[1,7.3],[-1,10.4],[1,10.9]].slice(0,n);const z=[2.4,3.6,4.8,6.5,7.8,9.4,10.7];return Array.from({length:n},(_,i)=>[i%2?1:-1,z[i>>1]])}
function drawHall(t){const vx=W/2,vy=H*.47,f=Math.min(W,H)*.62,pr=(x,y,z)=>[vx+x*f/z,vy+y*f/z],HW=1.5,FY=1.1,CY=-1.75,ZN=.4,ZF=13;
const fog=z=>Math.exp(-(z-1)*.15),col=(c,z,k=1)=>`rgb(${c.map(v=>Math.round(clamp(v*fog(z)*k,0,255))).join(",")})`,quad=(q,c)=>{ctx.fillStyle=c;poly(q);ctx.fill()};
ctx.fillStyle="#07060a";ctx.fillRect(0,0,W,H);hallHits=[];
/* far wall, with an arch into the greenhouse */
quad([pr(-HW,CY,ZF),pr(HW,CY,ZF),pr(HW,FY,ZF),pr(-HW,FY,ZF)],col([110,98,84],ZF));
const arch=[pr(-.55,FY,ZF)];for(let k=0;k<=16;k++){const a=Math.PI*k/16;arch.push(pr(-.55*Math.cos(a),-.35-.55*Math.sin(a),ZF))}arch.push(pr(.55,FY,ZF));
const gg=ctx.createLinearGradient(0,pr(0,-.9,ZF)[1],0,pr(0,FY,ZF)[1]);gg.addColorStop(0,"#9fd7b0");gg.addColorStop(1,"#2f6b3c");ctx.fillStyle=gg;poly(arch);ctx.fill();
ctx.save();poly(arch);ctx.clip();const rr=rng(12);for(let i=0;i<60;i++){const p=pr((rr()-.5)*1.1,(rr()-.2)*1.4,ZF);ctx.fillStyle=`rgba(${30+rr()*40},${90+rr()*60},${40+rr()*30},.9)`;ctx.beginPath();ctx.ellipse(p[0],p[1],3+rr()*3,2,rr()*3,0,7);ctx.fill()}ctx.restore();
glow(...pr(0,-.2,ZF),f/ZF*1.2,.25,[200,255,210]);hallHits.push({poly:arch,kind:"end"});
/* floor, walls, ceiling, from far to near */
const sl=[];for(let z=ZF-1;z>=1;z--)sl.push([z,z+1]);sl.push([ZN,1]);
for(const[z0,z1]of sl){for(let i=0;i<4;i++){const xa=-HW+i*.75,xb=xa+.75;quad([pr(xa,FY,z0),pr(xb,FY,z0),pr(xb,FY,z1),pr(xa,FY,z1)],col((i+Math.floor(z0))%2?[96,82,64]:[120,104,82],z0))}
quad([pr(-HW,CY,z0),pr(-HW,FY,z0),pr(-HW,FY,z1),pr(-HW,CY,z1)],col([112,100,86],z0));quad([pr(HW,CY,z0),pr(HW,FY,z0),pr(HW,FY,z1),pr(HW,CY,z1)],col([104,93,80],z0));
quad([pr(-HW,CY,z0),pr(HW,CY,z0),pr(HW,CY,z1),pr(-HW,CY,z1)],col([62,54,46],z0));
ctx.strokeStyle="rgba(0,0,0,.22)";ctx.lineWidth=1;for(let row=0,y=FY-.4;y>CY;y-=.4,row++)for(const s of[-1,1]){const zz=z0+(row%2)*.5;if(zz<z1){ctx.beginPath();ctx.moveTo(...pr(s*HW,y,zz));ctx.lineTo(...pr(s*HW,y-.4,zz));ctx.stroke()}}}
ctx.strokeStyle="rgba(0,0,0,.25)";for(let y=FY-.4;y>CY;y-=.4)for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(...pr(s*HW,y,ZN));ctx.lineTo(...pr(s*HW,y,ZF));ctx.stroke()}
for(let z=2;z<ZF;z++){ctx.strokeStyle=col([48,34,24],z);ctx.lineWidth=Math.max(1,.07*f/z);ctx.beginPath();ctx.moveTo(...pr(-HW,CY,z));ctx.lineTo(...pr(HW,CY,z));ctx.stroke()}
/* things along the walls, drawn far to near */
const obj=[];const kids=KIDS[hallId],slots=hallSlots(kids.length),busy=(s,a,b)=>slots.some(([ss,z0])=>ss===s&&z0<b&&z0+.95>a);
kids.forEach((id,i)=>{const[s,z0]=slots[i];obj.push({z:z0+.5,d:()=>hallDoor(pr,f,col,s,z0,id,t)})});
for(const z of[2,6,9,12])for(const s of[-1,1])if(!busy(s,z-.05,z+.25))obj.push({z,d:()=>{quad([pr(s*HW,FY,z),pr(s*(HW-.14),FY,z),pr(s*(HW-.14),CY,z),pr(s*HW,CY,z)],col([140,126,108],z));quad([pr(s*(HW-.14),FY,z),pr(s*(HW-.14),FY,z+.2),pr(s*(HW-.14),CY,z+.2),pr(s*(HW-.14),CY,z)],col([118,106,90],z));
const fl=pr(s*(HW-.2),-.55,z-.02),fz=f/z;ctx.fillStyle="#2b2622";ctx.fillRect(fl[0]-fz*.03,fl[1],fz*.06,fz*.18);glow(fl[0],fl[1],fz*.55*(.92+.08*Math.sin(t*11+z+s)),.5,[255,165,70]);ctx.fillStyle="#ffd27a";ctx.beginPath();ctx.ellipse(fl[0],fl[1]-fz*.04,fz*.025,fz*.06,0,0,7);ctx.fill()}});
if(!busy(-1,4.0,5.2))obj.push({z:4.6,d:()=>painting(pr,col,-1,4.0,5.2,0)});if(!busy(1,4.6,5.8))obj.push({z:5.2,d:()=>painting(pr,col,1,4.6,5.8,1)});
if(!busy(-1,9.0,10.2))obj.push({z:9.6,d:()=>statue(pr,f,col,-1,9.6)});if(!busy(1,9.6,10.8))obj.push({z:10.2,d:()=>statue(pr,f,col,1,10.2)});
obj.sort((a,b)=>b.z-a.z).forEach(o=>o.d());
const vg=ctx.createRadialGradient(W/2,H*.47,Math.min(W,H)*.25,W/2,H*.47,Math.max(W,H)*.8);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.65)");ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
function hallDoor(pr,f,col,s,z0,id,t){const HW=1.5,FY=1.1,top=-.5,ar=.475,zc=z0+ar,st=doorState(id),pts=[pr(s*HW,FY,z0)];
for(let k=0;k<=12;k++){const a=Math.PI*k/12;pts.push(pr(s*HW,top-Math.sin(a)*ar*.9,z0+(1-Math.cos(a))*ar))}pts.push(pr(s*HW,FY,z0+2*ar));
if(st==="amber"){ctx.save();ctx.globalCompositeOperation="lighter";const c=pr(s*HW,.1,zc);glow(c[0],c[1],1.3*f/zc,.28+.12*Math.sin(t*3),[255,160,50]);const fl=pr(s*1.05,FY,zc);ctx.fillStyle=`rgba(255,160,60,${.12+.05*Math.sin(t*3)})`;ctx.beginPath();ctx.ellipse(fl[0],fl[1],.55*f/zc,.12*f/zc,0,0,7);ctx.fill();ctx.restore()}
ctx.fillStyle=st==="open"?"#0d0908":col([104,68,40],zc);poly(pts);ctx.fill();
if(st!=="open"){ctx.strokeStyle=col([60,38,22],zc);ctx.lineWidth=1;for(const zz of[.24,.48,.72]){ctx.beginPath();ctx.moveTo(...pr(s*HW,FY,z0+zz*2*ar));ctx.lineTo(...pr(s*HW,top-.3,z0+zz*2*ar));ctx.stroke()}
const c=pr(s*HW,.18,zc),r=.13*f/zc;ctx.save();ctx.translate(c[0],c[1]);ctx.scale(.55,1);drawPlate(0,0,r);if(st==="covered")coverPlate(r);ctx.restore()}
ctx.strokeStyle=col([150,136,116],zc);ctx.lineWidth=Math.max(2,.07*f/zc);poly(pts);ctx.stroke();hallHits.push({poly:pts,kind:"door",id,st})}
/* a covered lock: the lock is still visible behind an iron cover */
function coverPlate(r){ctx.fillStyle="rgba(40,40,44,.92)";ctx.save();ctx.rotate(.6);ctx.fillRect(-r*1.15,-r*.22,r*2.3,r*.44);ctx.rotate(-1.2);ctx.fillRect(-r*1.15,-r*.22,r*2.3,r*.44);ctx.restore();ctx.fillStyle="#55555c";circ(0,0,r*.32);ctx.fill();ctx.fillStyle="#9a9aa2";circ(-r*.06,-r*.06,r*.1);ctx.fill()}
function painting(pr,col,s,za,zb,kind){const HW=1.49,ya=-1.3,yb=-.2,zc=(za+zb)/2,q=[pr(s*HW,ya,za),pr(s*HW,ya,zb),pr(s*HW,yb,zb),pr(s*HW,yb,za)];
ctx.fillStyle=col([222,204,160],zc);poly(q);ctx.fill();ctx.strokeStyle=col([210,160,60],zc);ctx.lineWidth=Math.max(2,4/zc*3);poly(q);ctx.stroke();
const yc=-.75,P=(y,z)=>pr(s*HW,y,z);ctx.strokeStyle=col([90,60,30],zc);ctx.lineWidth=1.2;
if(kind===0){const a=.17,b=.17,rad=.34;for(const z0 of[zc-a,zc+b]){ctx.beginPath();for(let k=0;k<=40;k++){const th=k/40*6.283,p=P(yc+.1+Math.sin(th)*rad*.75,z0+Math.cos(th)*rad*.55);k?ctx.lineTo(...p):ctx.moveTo(...p)}ctx.stroke()}
poly([P(yc+.1,zc-a),P(yc+.1,zc+b),P(yc+.1-.29,zc)]);ctx.stroke()}
else{const h=.3;poly([P(yc-h,zc-h*.7),P(yc-h,zc+h*.7),P(yc+h,zc+h*.7),P(yc+h,zc-h*.7)]);ctx.stroke();ctx.beginPath();ctx.moveTo(...P(yc-h,zc-h*.7));ctx.lineTo(...P(yc+h,zc+h*.7));ctx.moveTo(...P(yc-h,zc+h*.7));ctx.lineTo(...P(yc+h,zc-h*.7));ctx.stroke()}}
function statue(pr,f,col,s,z){const x=s*1.08,FY=1.1,k=f/z,m=c=>col(c,z);
ctx.fillStyle=m([150,140,126]);poly([pr(x-.28,FY,z),pr(x+.28,FY,z),pr(x+.28,.55,z),pr(x-.28,.55,z)]);ctx.fill();ctx.fillStyle=m([175,165,150]);poly([pr(x-.3,.55,z),pr(x+.3,.55,z),pr(x+.3,.5,z),pr(x-.3,.5,z)]);ctx.fill();
ctx.fillStyle=m([214,208,196]);poly([pr(x-.2,.5,z),pr(x+.2,.5,z),pr(x+.13,-.62,z),pr(x-.13,-.62,z)]);ctx.fill();
ctx.strokeStyle=m([150,142,130]);ctx.lineWidth=1;for(const d of[-.06,.02,.09]){ctx.beginPath();ctx.moveTo(...pr(x+d,.5,z));ctx.lineTo(...pr(x+d*.7,-.5,z));ctx.stroke()}
const h=pr(x,-.8,z);ctx.fillStyle=m([222,216,204]);circ(h[0],h[1],.16*k);ctx.fill();
ctx.strokeStyle=m([90,80,70]);ctx.lineWidth=Math.max(1,.03*k);ctx.beginPath();ctx.moveTo(...pr(x+s*-.14,-.35,z));ctx.lineTo(...pr(x+s*-.32,.1,z));ctx.moveTo(...pr(x+s*-.14,-.35,z));ctx.lineTo(...pr(x+s*-.2,.12,z));ctx.stroke();
const r=rng(z*10);ctx.fillStyle="#3c6a32";for(let i=0;i<14;i++){const p=pr(x+(r()-.5)*.6,FY-r()*.6,z);ctx.beginPath();ctx.ellipse(p[0],p[1],.03*k,.02*k,r()*3,0,7);ctx.fill()}}
function inPoly(p,q){let c=false;for(let i=0,j=q.length-1;i<q.length;j=i++){if(((q[i][1]>p[1])!==(q[j][1]>p[1]))&&(p[0]<(q[j][0]-q[i][0])*(p[1]-q[i][1])/(q[j][1]-q[i][1])+q[i][0]))c=!c}return c}

/* ---------- input ---------- */
function begin(){audioInit();go("intro")}
cv.addEventListener("pointerdown",e=>{const x=e.clientX,y=e.clientY;audioInit();if(fade)return;
if(scene==="title")return begin();if(scene==="intro")return endIntro();
if(scene==="doors"){const D=doorLayout();if(y<D.y0||y>D.y0+D.dh||x<D.x0||x>D.x0+D.tw)return;const id=x<D.x0+D.lw?1:4;
if(!solved(id))return openLock(id);if(doorOpenAmt(id)>=1){hallId=id;fadeTo("hall",800)}return}
if(scene==="lock"){cv.setPointerCapture(e.pointerId);return lockId===4?l4Down(x,y):lkDown(x,y)}
if(scene==="hall"){for(let i=hallHits.length-1;i>=0;i--){const h=hallHits[i];if(!inPoly([x,y],h.poly))continue;if(h.kind==="end")toast("The greenhouse is still being planted.");else if(h.st==="amber"){sfxChime(false);toast("This hall is still being built.")}else if(h.st==="covered"){sfxRattle();toast("Its lock is covered.")}return}}});
cv.addEventListener("pointermove",e=>{if(scene==="lock")(lockId===4?l4Move:lkMove)(e.clientX,e.clientY)});
cv.addEventListener("pointerup",e=>{if(scene==="lock")(lockId===4?l4Up:lkUp)(e.clientX,e.clientY)});
cv.addEventListener("pointercancel",()=>{if(scene==="lock"){LK.drag=null;LK4.drag=null;if(LK4.ghost&&LK4.ghost.t!=="t")LK4.ghost=null}});
addEventListener("keydown",e=>{if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"))return;audioInit();if(scene==="title")begin();else if(scene==="intro")endIntro()});
document.getElementById("back").addEventListener("click",()=>{if(scene==="lock"||scene==="hall")fadeTo("doors",600)});
document.getElementById("replay").addEventListener("click",()=>{audioInit();fade=null;go("intro")});
requestAnimationFrame(frame);
</script>
